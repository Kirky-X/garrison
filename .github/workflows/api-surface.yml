name: API Surface

on:
  schedule:
    # 每周一 04:00 UTC（与 feature-matrix 03:00 错峰）
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-surface:
    name: Public API baseline (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly 分支快照（声明 toolchain 输入）, nosemgrep
        with:
          toolchain: nightly
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-api-surface
      - name: Generate public API baseline
        run: bash scripts/api_surface.sh
      - name: Upload API surface artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-surface
          path: logs/api-surface.txt
          retention-days: 30
