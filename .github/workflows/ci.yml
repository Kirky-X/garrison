name: CI

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  # === 基础检查：默认特性（default = backend-embedded） ===
  # sdforge build script 需要 protoc；用 taiki-e/install-action 跨平台统一安装（SHA pin 防供应链攻击）
  check-default:
    name: Check (default = backend-embedded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
        with:
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-default-deps
      - name: Check (default features)
        run: cargo check --locked
      - name: Build (default features)
        run: cargo build --locked

  # === 全特性检查 ===
  check-full:
    name: Check (full features)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
        with:
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Check (full)
        run: cargo check --features "full" --locked
      - name: Build (full)
        run: cargo build --features "full" --locked

  # === 生产组合编译门禁 ===
  # 验证 production 聚合特性与 examples workspace 全特性均可独立编译，
  # 并强制 --locked 与已提交 Cargo.lock 一致（T31）。
  check-production:
    name: Check (production + examples)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
        with:
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-prod-deps
      - name: Check (production features)
        run: cargo check --features "production" --locked
      - name: Check (examples, all features)
        run: cargo check -p garrison-examples --all-features --locked

  # === 格式化检查 ===
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # === Clippy ===
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
        with:
          components: clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Clippy (default)
        run: cargo clippy --no-default-features --features "default" -- -D warnings
      - name: Clippy (full)
        run: cargo clippy --features "full" -- -D warnings

  # === 测试矩阵 ===
  # GitHub Actions 限制：uses 字段不能使用 matrix 上下文（解析期未展开 matrix）
  # 因此固定使用 1.85.1 SHA pin，通过 with.toolchain 参数切换实际工具链版本
  # protoc 用 taiki-e/install-action 跨平台统一安装（Linux/macOS/Windows 均支持）
  test:
    name: Test (${{ matrix.os }} / Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Linux runner 上 sqlite 文件库 URL 在 1.85/beta 面触发
      # SQLITE_READONLY（预创建空文件亦然），统一回退内存库；
      # macOS/Windows 文件库修多连接 "no such table" 偶发。
      GARRISON_TEST_SQLITE_MEMORY: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [1.85, stable, beta]
        exclude:
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test-deps-${{ matrix.rust }}
      - name: Test (default)
        run: cargo test --no-default-features --features "default" --lib --locked
      - name: Test (full)
        run: cargo test --features "full" --lib --locked

  # === 文档构建 ===
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Build docs
        run: cargo doc --no-deps --features "full"
      - name: Install cargo-deadlinks
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # cargo-deadlinks
        with:
          tool: cargo-deadlinks
      # 死链检查（显性化策略 — 规则 12：不掩盖，分类处理）
      #
      # 根因分析（2026-07-21）：死链全部来自外部 crate trait 的 blanket impl：
      #   - `Context` ← opentelemetry::FutureExt::with_context doc 中的 [`Context`] intra-doc link
      #   - `dispatcher` ← tracing_subscriber::WithSubscriber doc 中的 [default subscriber] reference link
      #   - `Response` ← warp::Reply::into_response doc 中的 [`Response`] intra-doc link
      # rustdoc 在 `--no-deps` 模式下无法解析这些外部 intra-doc link，生成相对路径 → 死链。
      # 切换 nightly + `--extern-html-root-url` 可修复，但项目用 stable Rust 1.85。
      #
      # 处理策略：
      #   1. 过滤已知外部 crate 死链（Context/dispatcher/Response）— 不阻断 CI
      #   2. 新死链（garrison 自身 doc comment 问题）— 阻断 CI
      # 这样移除 continue-on-error，让死链检查成为真实门禁，同时不掩盖已知外部问题。
      - name: Check broken links
        run: |
          set -euo pipefail
          OUTPUT=$(cargo deadlinks --dir target/doc/garrison 2>&1 || true)
          echo "$OUTPUT"
          # 过滤已知外部 crate 死链（opentelemetry Context / tracing-subscriber dispatcher / warp Response）
          # 精确匹配路径片段边界（/ 或 . 分隔），避免误过滤 TenantContext/GarrisonResponse 等自身类型
          # - `config/Context does not exist` ← opentelemetry::FutureExt blanket impl
          # - `config/dispatcher does not exist` ← tracing_subscriber::WithSubscriber blanket impl
          # - `error/type.Response.html does not exist` ← warp::Reply::into_response blanket impl
          NEW_DEADLINKS=$(echo "$OUTPUT" | grep "does not exist" | grep -vE "[/.](Context|dispatcher|Response)(\.html)? does not exist" || true)
          if [ -n "$NEW_DEADLINKS" ]; then
            echo "❌ Found new deadlinks (not from external crate trait impls):"
            echo "$NEW_DEADLINKS"
            exit 1
          else
            echo "✅ No new deadlinks. Known external-crate deadlinks (Context/dispatcher/Response) filtered."
          fi

  # === cargo-deny（漏洞 / 许可证 / 禁用源 / 重复依赖） ===
  # cargo-deny 已覆盖 cargo-audit 的漏洞检查功能，且配置统一在 deny.toml 管理。
  # 删除独立 audit job，避免维护两份忽略列表（audit.toml + deny.toml）。
  # 用 runner 原生 cargo-deny 而非 EmbarkStudios 容器 action：容器内
  # rustup 仅含固定版本 musl toolchain，无法满足 rust-toolchain.toml
  # 的 stable override（startup 即报 uninstalled toolchain）。
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
      - uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # v1
        with:
          tool: cargo-deny
      - name: Generate Cargo.lock (library crate, not committed)
        run: cargo generate-lockfile
      - name: Run cargo deny
        run: cargo deny --all-features --locked check

  # === 集成测试（tests/ 目录，仅 Linux + MSRV） ===
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      GARRISON_TEST_SQLITE_MEMORY: "1"
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Integration tests (full features)
        # 用 --tests 而非 --test '*'：--test '*' 会显式展开所有 [[test]] target，
        # 遇到 required-features 不满足的（如 db_mysql_testcontainers 需要 db-mysql）会报错。
        # --tests 自动跳过 required-features 不满足的 test target。
        # db_mysql_testcontainers 需要 Docker + testcontainers 拉 MySQL 镜像，本地手动跑。
        run: cargo test --features "full" --tests --no-fail-fast

  # === 覆盖率（仅 Linux） ===
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      # llvm-cov 面下 sqlite 文件库 URL 触发 SQLITE_READONLY，回退内存库
      GARRISON_TEST_SQLITE_MEMORY: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-coverage-deps
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Run coverage (fail under 85% lines)
        run: cargo llvm-cov --features "full" --fail-under-lines 85 --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
