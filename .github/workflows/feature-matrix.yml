#
# Feature 组合矩阵与 examples 测试（审查报告 R-09/R-10）。
#
# - R-09：108 个 feature 的 each-feature 独立编译检查 + 重点两两组合采样。
#   全量 powerset 为 O(2^108)，不可行；单一 feature + 定向采样覆盖
#   「feature 单独启用/组合冲突」两类历史事故面（如 db-* × embedded-migrations、
#   protocol-* × secure-ct-eq、web-* × annotation-macros）。
# - R-10：examples 是独立 workspace member，根目录 `cargo test --features full`
#   不会运行其 103 个测试；本工作流补齐该盲区。
#
# 调度策略：每周一 03:00 UTC 定时 + 手动触发，不阻塞 PR 关键路径。
# 出现红色结果时按 feature 组合逐项 triage：真实冲突 → 修 Cargo.toml 依赖约束
# 或登记 check-cfg；误报 → 加入排除清单并注释原因。

name: Feature Matrix

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  each-feature:
    name: Each-feature check (cargo-hack)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-feature-matrix
      - name: Install cargo-hack
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # cargo-hack
        with:
          tool: cargo-hack
      - name: Check each feature individually
        # --no-dev-deps 跳过测试依赖编译，显著提速；--keep-going 收集全部失败便于一次性 triage。
        run: cargo hack check --each-feature --no-dev-deps --keep-going
      - name: Targeted two-feature combinations
        run: |
          cargo hack check --no-dev-deps --features "db-mysql,embedded-migrations"
          cargo hack check --no-dev-deps --features "db-sqlite,protocol-apikey"
          cargo hack check --no-dev-deps --features "db-postgres,three-tier-cache"
          cargo hack check --no-dev-deps --features "protocol-jwt,secure-ct-eq"
          cargo hack check --no-dev-deps --features "protocol-saml,protocol-oidc"
          cargo hack check --no-dev-deps --features "web-warp,annotation-macros"
          cargo hack check --no-dev-deps --features "web-actix,web-security"
          cargo hack check --no-dev-deps --features "auth-server,backend-remote"
          cargo hack check --no-dev-deps --features "oauth2-server,cache-redis"
          cargo hack check --no-dev-deps --features "tenant-isolation,firewall-bruteforce"
      - name: Targeted two-feature test compile
        # 与上方组合逐一对应，用 test --no-run 补齐「测试代码」编译维度：
        # check 不编译 #[cfg(test)]，测试代码的 feature 门控漂移只有编译测试才暴露
        # （2026-09 实录：sso/annotation mock 缺原子方法、password.rs 引用未启用 listener）。
        run: |
          cargo test --lib --no-run --no-default-features --features "db-mysql,embedded-migrations"
          cargo test --lib --no-run --no-default-features --features "db-sqlite,protocol-apikey"
          cargo test --lib --no-run --no-default-features --features "db-postgres,three-tier-cache"
          cargo test --lib --no-run --no-default-features --features "protocol-jwt,secure-ct-eq"
          cargo test --lib --no-run --no-default-features --features "protocol-saml,protocol-oidc"
          cargo test --lib --no-run --no-default-features --features "web-warp,annotation-macros"
          cargo test --lib --no-run --no-default-features --features "web-actix,web-security"
          cargo test --lib --no-run --no-default-features --features "auth-server,backend-remote"
          cargo test --lib --no-run --no-default-features --features "oauth2-server,cache-redis"
          cargo test --lib --no-run --no-default-features --features "tenant-isolation,firewall-bruteforce"
      - name: Test compile each feature individually
        # 单 feature 维度的测试编译全量兜底（需要 dev-deps，不用 --no-dev-deps）。
        # 不用 cargo hack --each-feature：其基线附带 --all-features 运行，而 garrison
        # 同时启用 db-sqlite 与 db-mysql/db-postgres 会被 dbnexus 的互斥 compile_error
        # 拒绝（多 DB 共存仅在「部署期选一个」的语义下合法），故显式跳过聚合特性。
        run: |
          FEATURES=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "garrison") | .features | keys[]' | grep -vE '^(default|full|production)$')
          FAILED=0
          for f in $FEATURES; do
            if ! cargo test --lib --no-run --no-default-features --features "$f" > /dev/null 2>&1; then
              echo "❌ feature '$f' 测试编译失败："
              cargo test --lib --no-run --no-default-features --features "$f" 2>&1 | grep -E "^error" -A 5 || true
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "存在测试编译失败的 feature，详见上方"
            exit 1
          fi
          echo "✅ 全部单 feature 测试编译通过"

  examples:
    name: Examples tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b0480e2d44a72e89a62650e223ba831cbca8d2be # 1.85.1, nosemgrep
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-examples-deps
      - name: Run examples tests (independent workspace member)
        run: cargo test -p garrison-examples --all-features --locked
