[package]
name = "garrison"
version = "0.9.0-rc.1"
edition = "2021"
rust-version = "1.85"  # MSRV: 部分 deps（如 inventory 0.3）要求 edition2024 → Rust 1.85+
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
description = "Garrison - 面向 Rust 生态的一站式身份认证鉴权框架"
homepage = "https://github.com/Kirky-X/garrison"
repository = "https://github.com/Kirky-X/garrison"
documentation = "https://docs.rs/garrison"
readme = "README.md"
keywords = ["auth", "authentication", "authorization", "jwt", "rbac"]
categories = ["authentication", "web-programming"]

[workspace]
members = [".", "examples", "macros"]
resolver = "2"

[workspace.package]
version = "0.9.0-rc.1"
edition = "2021"
rust-version = "1.85"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/Kirky-X/garrison"
repository = "https://github.com/Kirky-X/garrison"
documentation = "https://docs.rs/garrison"
keywords = ["auth", "authentication", "authorization", "jwt", "rbac"]
categories = ["authentication", "web-programming"]

[workspace.dependencies]
garrison = { path = ".", default-features = false }
garrison-macros = { version = "0.9.0-rc.1", path = "macros" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["sync", "macros", "rt-multi-thread", "time", "signal"] }
async-trait = "0.1"
parking_lot = "0.12"
inventory = "0.3"
axum = { version = "0.8", default-features = false, features = ["json"] }
actix-web = { version = "4.12", default-features = false }
warp = { version = "0.4", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
oxcache = { version = "0.5.0-rc.4", path = "../base/oxcache", default-features = false }
dbnexus = { version = "0.6.0-rc.4", path = "../base/dbnexus", default-features = false }
md5 = { version = "0.8" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
rand = { version = "0.10" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
wiremock = "0.6"
http-body-util = "0.1"
tempfile = { version = "3.27" }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
totp-rs = { version = "6.0" }
bcrypt = { version = "0.19" }
zeroize = { version = "1.9", default-features = false, features = ["derive", "serde"] }
regex = { version = "1.13", default-features = false }
serial_test = "4.0"

[lib]
name = "garrison"
path = "src/lib.rs"

[dependencies]
# === Required dependencies ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
confers = { version = "0.6.0-rc.4", path = "../base/confers" }
tokio = { version = "1.53", features = ["sync", "macros", "rt-multi-thread", "time", "signal"] }
inventory = "0.3"
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"
parking_lot = "0.12"
arc-swap = { version = "1.9", default-features = false }
dashmap = { version = "6.2", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }
http = "1.5"
unicode-normalization = "0.1"

# === Optional dependencies (feature-gated) ===
axum = { optional = true, default-features = false, features = ["json"], workspace = true }
axum-server = { version = "0.8", optional = true, default-features = false }
actix-web = { optional = true, default-features = false, workspace = true }
warp = { optional = true, default-features = false, workspace = true }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"], optional = true }
reqwest = { optional = true, default-features = false, features = ["json", "rustls", "form"], workspace = true }
totp-rs = { version = "6.0", optional = true }
sha2 = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
subtle = { version = "2.6", optional = true, default-features = false, features = ["std"] }
base64 = { version = "0.23", optional = true }
md5 = { version = "0.8", optional = true }
base32 = { version = "0.5", optional = true }
argon2 = { version = "0.6", optional = true }
bcrypt = { version = "0.19", optional = true }
rand = { optional = true, workspace = true }
# rand 0.10 移除了 OsRng 结构体（rand_core 0.10 改由 getrandom 提供系统熵），
# 令牌/备份码/CSRF 等纯字节随机路径直接使用 getrandom::fill（保持直接读 OS CSPRNG 的安全立场）。
# 用 0.4 最新稳定线；rand_core 0.10 内部自用的 getrandom 0.3 由 cargo 双版本共存，互不影响
getrandom = { version = "0.4", optional = true }
zeroize = { version = "1.9", optional = true, default-features = false, features = ["derive", "serde"] }
regex = { version = "1.13", optional = true, default-features = false }
# optional 化：唯一常驻使用点 three-tier-cache（src/cache/three_tier.rs）显式 dep:oxcache；
# dao/oxcache_impl（cache-memory|cache-redis）与 abac（经 cache-memory）经 oxcache/* 引用自动激活。
oxcache = { version = "0.5.0-rc.4", path = "../base/oxcache", default-features = false, optional = true }
# dbnexus 0.4+ 在 src/lib.rs#L51 设置 compile_error!，强制至少启用一个数据库驱动 feature
# （sqlite/postgres/mysql/duckdb/ladybug/neo4j）。因此 dbnexus 必须 optional，由 db-base feature
# 透传 dbnexus/<driver> 启用对应驱动。这并非手写绕过，而是 dbnexus 0.4 API 设计的硬性约束。
dbnexus = { optional = true, default-features = false, workspace = true }
prometheus = { version = "0.14", optional = true, default-features = false }
tracing-subscriber = { optional = true, default-features = false, features = ["fmt", "json", "env-filter"], workspace = true }
opentelemetry = { version = "0.32", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", optional = true, default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["trace", "grpc-tonic"] }
tonic = { optional = true, default-features = false, features = ["transport"], workspace = true }
tonic-health = { version = "0.14", optional = true, default-features = false }
# grpc feature：GarrisonGrpcAuthLayer 的 tower Layer/Service（核心 trait，无 util）
# 桥接 sdforge/grpc：启用后 #[forge] 宏生成的 gRPC 路由注册（cfg(feature = "grpc")）
# 在 garrison 上下文编译进来，与 GarrisonGrpcAuthLayer 共用同一 tonic 栈（prost/tonic-prost 由 sdforge 引入）
tower = { version = "0.5", optional = true, default-features = false }
fluent = { version = "0.17", default-features = false }
unic-langid = { version = "0.9", default-features = false }
# 系统语言探测：i18n detect_locale 检测链末端（env 链未命中时读取 OS locale）
sys-locale = "0.3"
miette = { version = "7.6", optional = true, default-features = false }
garrison-macros = { optional = true, workspace = true }
# rsa 0.9 内部依赖 sha2 0.10，与项目 sha2 0.11 不兼容，故用 `rsa::pkcs1v15::SigningKey` + `rsa::sha2::Sha256`（sha2 0.10 re-export）
rsa = { version = "0.9", optional = true, default-features = false, features = ["sha2", "pem", "getrandom"] }
unicode-security = { version = "0.1", optional = true, default-features = false }
# IP 白名单 CIDR 解析（account-authflow 的 IpWhitelisted 条件真实求值）
ipnetwork = { version = "0.21", optional = true, default-features = false }
# HIBP k-anonymity 前缀哈希（policy-hibp 使用；sha2 0.11 不再包含 Sha1，
# 需独立的 sha1 0.11——RustCrypto 0.11 稳定版已发布，无需再锁 rc）
sha1 = { version = "0.11", optional = true, default-features = false }
quick-xml = { version = "0.42", default-features = false, features = ["serialize"], optional = true }
# 版本与 oxcache 0.5 的 redis 间接依赖保持一致，避免双版本共存

futures = { version = "0.3", default-features = false, features = ["std"] }
# mimalloc 全局分配器（auth_server 二进制使用，多线程分配性能优于系统默认分配器）
mimalloc = { version = "0.1", optional = true }
# optional 化：唯一使用点 observability/inklog（audit-inklog 门控），其 inklog/* 引用自动激活。
inklog = { version = "0.3.0-rc.4", path = "../base/inklog", default-features = false, optional = true }
limiteron = { version = "0.3.0-rc.4", path = "../base/limiteron", default-features = false, features = ["distributed"] }
# sdforge 运行时：`features = ["http"]` 让 `sdforge::http::build()` / `RouteRegistration`
# 始终可用（`server_impl.rs` 无条件调用 `sdforge::http::build()`）。
# 但 `#[forge]` 宏生成的 `inventory::submit!` 被 `#[cfg(feature = "http")]` 保护，
# 此 cfg 在 **garrison 上下文** 求值——garrison 必须暴露同名 `http` feature 才能让
# 路由注册代码编译进来。详见 `[features]` 段的 `http` 桥接 feature。
# 2026-09-19 审计 optional 化：sdforge 仅被 auth-server 门控的 src/server 使用；
# 由 auth-server-sdforge（dep:sdforge）与 api-docs（sdforge/openapi）按需激活。
# default 构建不再白编译 axum/tower 栈，也不再要求 sdforge build.rs 的 protoc。
sdforge = { version = "0.5.0-rc.4", path = "../base/sdforge", default-features = false, features = ["http"], optional = true }
trait-kit = { version = "0.5.0-rc.5", path = "../base/trait-kit", default-features = false, features = ["async"] }
cedar-policy = { version = "4.12", default-features = false, optional = true }
icu_plurals = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_datetime = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_decimal = { version = "2.3", default-features = false, features = ["compiled_data", "alloc"], optional = true }
icu_locale_core = { version = "2.3", default-features = false, optional = true }
icu_calendar = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_time = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
fixed_decimal = { version = "0.7", optional = true, default-features = false }
percent-encoding = { version = "2.3", optional = true, default-features = false }
hkdf = { version = "0.13", optional = true, default-features = false }
# 嵌入式迁移文件（embedded-migrations feature）：编译时用 include_dir! 嵌入 postgres 迁移 SQL，
# 供 crates.io 消费者在运行时无需访问 garrison 源码目录即可执行迁移。
include_dir = { version = "0.7", optional = true }
tempfile = { version = "3.27", optional = true }
# 邮件发送（email-verification-smtp feature）：内置 SMTP 实现，业务方也可仅启用 email-verification 自行实现 EmailSender trait
lettre = { version = "0.11", optional = true, default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls", "hostname"] }

[dev-dependencies]
once_cell = "1.21"
toml = "1.1"
tokio-test = "0.4"
mockall = "0.15"
# tempfile 同时存在于 [dependencies]（optional，由 embedded-migrations feature 启用，供生产代码使用）
# 与 [dev-dependencies]（测试代码无条件可用，如 db-sqlite 下的 tempdir 测试）。
# Cargo 允许同名 crate 同时出现在两处，dev-dep 在测试构建时优先生效。
tempfile = "3.27"
# serial_test 用于串行化依赖 std::env::set_var 的测试，避免多线程并发污染环境变量
serial_test = "4.0"
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = { workspace = true }
wiremock = { workspace = true }
warp = { default-features = false, features = ["test"], workspace = true }
# getrandom：测试用 rsa::rand_core::OsRng（rand 0.10 已无 OsRng；rsa 0.9 keygen
# 基于 rand_core 0.6 trait，rand 0.10 的 RNG 不兼容）。在 dev-deps 声明使
# keycloak-oidc 等未启用可选 rsa 的测试面也能解析 OsRng
rsa = { version = "0.9", features = ["getrandom"] }
rand = { workspace = true }
testcontainers = "0.27"
criterion = { version = "0.8", features = ["html_reports"] }
# rcgen 用于 BackendRemote mTLS 测试中生成自签名证书
rcgen = "0.14"
# 集成测试需要直接发送 HTTP 请求到服务器，因此无条件引入 reqwest；
# cookies 供 keycloak_fixture 以 cookie jar 驱动真实登录表单流
reqwest = { default-features = false, features = ["json", "rustls", "cookies"], workspace = true }
# macros UI 测试（tests/macros_ui.rs）：trybuild 子项目继承父 dev-deps（axum 供
# `use axum::response::IntoResponse`），annotation-macros feature 由测试运行面透传
trybuild = "1.0"
axum = { version = "0.8", default-features = false }

[features]
default = ["backend-embedded"]

# === 核心模块（always on，无开关） ===
# core / stp / annotation / router / dao / strategy / session / config / context / json / exception / manager / plugin
# 这些模块无 feature flag，总是编译

# === 核心扩展：决策溯源 / 权限注册表 / forbid 优先语义 ===
# 合并 decision-trace + permission-registry + safe-defaults → core-advanced
core-advanced = []

# === 核心扩展：请求对象式授权 API ===
authorize-api = ["core-advanced"]

# === 核心扩展：显式 Manager API ===
manager-explicit = ["authorize-api"]

# === 核心扩展：多租户逻辑隔离 ===
# Repository SQL 过滤不门控此 feature（始终生效，安全优先）。
tenant-isolation = ["limiteron/multi-tenant"]

# === 配置增强（confers 0.5 透传） ===
config-encryption = ["confers/encryption"]
config-validation = ["confers/validation"]
config-hot-reload = ["confers/watch"]
config-interpolation = ["confers/interpolation"]
config-dynamic = ["confers/dynamic"]
config-toggle = ["confers/feature-toggle"]
# 配置增强特性（透传 confers 高级能力）
config-yaml = ["confers/yaml"]
config-audit = ["confers/audit"]
config-consul = ["confers/consul"]
config-etcd = ["confers/etcd"]
config-distributed = ["confers/distributed"]
config-schema = ["confers/schema"]
# 一键启用全部配置增强
config-full = ["config-encryption", "config-validation", "config-hot-reload", "config-interpolation", "config-dynamic", "config-toggle", "config-yaml", "config-audit", "config-consul", "config-etcd", "config-distributed", "config-schema", "config-security-rules"]
# 配置安全校验器（吸收 confers/security-rules）：JWT 密钥强度 / CORS / SSRF / TLS
# 内置校验器 + SecurityValidator 注册表，配置加载期 fail-fast
config-security-rules = ["confers/security-rules"]

# === 缓存后端（通过 oxcache） ===
cache-memory = ["oxcache/memory", "oxcache/serialization", "oxcache/metrics", "oxcache/bloom"]
# 缓存审计事件流（吸收 oxcache/audit）：hit/miss/set/delete/evict/expired 结构化
# 事件经 TracingAuditPublisher 桥接 tracing，键名自动脱敏（GarrisonDaoOxcache 自动接线）
cache-audit = ["cache-memory", "oxcache/audit", "oxcache/telemetry"]
cache-redis = ["cache-memory", "oxcache/redis", "oxcache/lua", "oxcache/pubsub", "oxcache/compression"]
cache-lock = ["cache-redis", "oxcache/lock"]
cache-batch = ["cache-memory", "oxcache/batch"]
# 跨实例缓存一致性：oxcache 键空间通知失效（多实例部署下 L1 自动同步）
cache-invalidation = ["cache-redis", "oxcache/invalidation"]
# 封禁记录跨实例同步：limiteron 经 oxcache Pub/Sub 广播封禁变更
ban-sync = ["limiteron/ban-sync", "cache-invalidation"]

# === 数据库后端（通过 dbnexus 0.4） ===
# [INTERNAL] dbnexus 禁止 embedded 与 server-side 混用。
db-base = [
    "dep:dbnexus",
    "dbnexus/runtime-tokio-rustls",
    "dbnexus/permission",
    "dbnexus/sql-parser",
    "dbnexus/macros",
    "dbnexus/config-env",
    "dbnexus/with-time",
    "dbnexus/auto-migrate",
    "dbnexus/pool-health-check",
    "dbnexus/with-uuid",
    "dbnexus/with-chrono",
    "dbnexus/pool-warmup",
    "dbnexus/failover",
    "dbnexus/observability",
]
# db-sqlite 启用 sqlite embedded 驱动
db-sqlite = ["db-base", "dbnexus/sqlite"]
db-postgres = ["db-base", "dbnexus/postgres", "embedded-migrations"]
db-mysql = ["db-base", "dbnexus/mysql"]
db-retry = ["db-base", "dbnexus/retry"]
# 数据库增强特性（透传 dbnexus 高级能力）
# sharding 聚合：分片 + 分布式 ID + scatter-gather 并行查询
db-sharding = ["db-base", "dbnexus/sharding", "dbnexus/distributed-id", "dbnexus/scatter-gather"]
db-replica = ["db-base", "dbnexus/replica-routing"]
db-saga = ["db-sharding", "dbnexus/saga"]

# 嵌入式迁移文件：编译时用 include_dir! 嵌入 postgres 迁移 SQL，
# 供 crates.io 消费者在运行时无需访问 garrison 源码目录即可执行迁移。
embedded-migrations = ["dep:include_dir", "dep:tempfile"]

# === 协议层插件 ===
protocol-oauth2 = ["dep:reqwest", "dep:sha2", "dep:base64", "dep:percent-encoding"]
# protocol-sso 隐含 protocol-jwt：OIDC exchange_code 必须验签 id_token（fail-closed）。
protocol-sso = ["dep:reqwest", "dep:quick-xml", "dep:sha2", "dep:hmac", "dep:base64", "dep:percent-encoding", "protocol-jwt"]
protocol-jwt = ["dep:jsonwebtoken", "dep:sha2"]
protocol-sign = ["dep:sha2", "dep:hmac", "dep:base64", "dep:hkdf"]
# protocol-apikey：API Key 生成/校验/吊销/轮换。
# dep:sha2 + secure-ct-eq：secret 以 sha256 哈希存储（CWE-916）+ 复用公共常量时间比较原语（消除本地副本）。
# dao-key-index：启用 GarrisonDaoOxcache::keys() 生产实现，使 list_by_namespace 可用。
protocol-apikey = ["dep:sha2", "secure-ct-eq", "dao-key-index"]
protocol-temp = []
# protocol-invitation：邀请码定向注册（一次性/N 次、TTL、吊销、防爆破、注册编排钩子）。
# dep:rand：短码随机字符选取（OsRng）；dep:sha2：防爆破计数键的 source 摘要（SHA-256）。
protocol-invitation = ["dep:rand", "dep:sha2"]
# protocol-zeroize：协议层密钥零化（Drop 时清零 secret 字段，防止内存残留）
# 启用 rsa/zeroize 让 RsaPrivateKey 实现 Zeroize（AlipayProvider Drop 清零 RSA 私钥大数）
# NOTE: rsa 0.9.10 没有 zeroize feature，暂时移除以解除编译阻塞
protocol-zeroize = ["dep:zeroize"]
# OIDC 扩展（id_token 签发/验证 + discovery endpoint），依赖 protocol-jwt + protocol-oauth2
protocol-oidc = ["protocol-jwt", "protocol-oauth2", "dep:subtle"]
# OAuth2 Scope Handler 注册表（ScopeHandler trait + ScopeRegistry），依赖 protocol-oauth2
oauth2-scope-handler = ["protocol-oauth2"]
# SSO Server 独立抽象（SsoServer trait + CenterIdConverter + SsoChannel），依赖 protocol-sso
protocol-sso-server = ["protocol-sso"]
# protocol-saml：启用 XmlSecSamlProvider，使用 rsa crate 验证 SAML Assertion XML 签名
# dep:subtle：DigestValue 比对使用常量时间比较
protocol-saml = ["protocol-sso", "dep:rsa", "dep:base64", "dep:subtle"]

# === 安全模块 ===
secure-totp = ["dep:totp-rs", "dep:base32"]
secure-sign = ["dep:sha2", "dep:hmac", "dep:base64", "dep:subtle"]
# secure-httpbasic → protocol-httpbasic（域统一到协议层）
protocol-httpbasic = ["dep:base64"]
# secure-httpdigest → protocol-httpdigest（域统一到协议层）
protocol-httpdigest = ["dep:sha2", "dep:base64", "dep:md5", "dep:subtle", "dep:hkdf", "dep:hmac"]
# Unicode 同形异义字检测
secure-confusable = ["dep:unicode-security"]
# 依赖 regex：Custom mask 真实脱敏（原 placeholder 实现静默泄露敏感数据）
secure-masking = ["dep:regex"]
secure-xss = []
secure-sanitize = []
sms-rate-limit = ["dep:rand"]
# 邮箱验证码（基础 trait + service + rate_limiter，业务方自行实现 EmailSender）
email-verification = ["dep:rand"]
# 邮箱验证码 SMTP 内置实现（lettre，含 SmtpEmailSender）
email-verification-smtp = ["email-verification", "dep:lettre"]

# === 账号安全引擎 ===
account-credential = ["dep:argon2", "dep:bcrypt", "dep:rand", "dep:getrandom", "dep:sha2", "dep:base32"]
# account-credential-zeroize → credential-zeroize（缩短名称）
credential-zeroize = ["account-credential", "dep:zeroize"]
account-policy = ["account-credential", "dep:regex"]
account-lockout = ["firewall"]
account-authflow = ["account-credential", "account-policy", "account-lockout", "dep:ipnetwork"]
# HIBP 泄露密码检查（k-anonymity range search，网络调用；关闭时返回显性错误）
policy-hibp = ["dep:reqwest", "dep:sha1"]

# === Web 框架适配 ===
web-axum = ["dep:axum", "axum/tokio", "axum/http1"]
web-actix = ["dep:actix-web"]
web-warp = ["dep:warp"]

# === HTTPS/TLS 终止（axum-server rustls） ===
# 依赖 auth-server（server 模块门控）
tls = ["dep:axum-server", "axum-server/tls-rustls", "auth-server"]

# === Server 增强 ===
# server-health-check：接线 sdforge/health（0.5.0-rc.4 起提供）——/healthz /readyz
# 探针 merge 在路由最外层（axum merge 不继承 layer），天然绕过 path_filter/
# rate_limit/audit/api_key_auth，符合 K8s 探针语义。业务方可经
# sdforge::health::register_readiness_check_fn 注册下游依赖就绪检查。
server-health-check = ["auth-server", "sdforge/health"]
# graceful shutdown——SIGTERM/SIGINT 触发后停止接收
# 新连接并 drain 在途请求；auth-server 聚合默认包含
server-graceful-shutdown = []

# === Web 安全中间件 ===
# web-waf 已废弃（与 firewall-waf 功能 100% 重叠），统一使用 firewall-waf
web-cors = ["web-axum"]
web-csrf = ["web-axum", "dep:rand", "dep:getrandom", "dep:base64", "dep:subtle"]
# HTTP 安全响应头中间件（X-Content-Type-Options / X-Frame-Options / HSTS / Cache-Control）
web-security-headers = ["web-axum"]
# Web 安全中间件聚合（CORS + CSRF + 安全响应头）
web-security = ["web-cors", "web-csrf", "web-security-headers"]

# === 过程宏注解（#[check_login]/#[check_permission]/#[check_role]） ===
# 依赖 web-axum（宏生成的 wrapper 返回 axum::response::Response）
annotation-macros = ["dep:garrison-macros", "web-axum"]

# === 扩展 ===
# AloneCache 装饰器：DAO 层单飞缓存（dao::alone_cache，未命中再加锁回源，防击穿）
alone-cache = []
# STP 参数化查询：strategy 层 parameter 模块（按参数占位符构造查询）
parameter-query = []
api-docs = ["sdforge/openapi"]

# === 审计日志 ===
# dep:getrandom：AuditEventChain 链首随机盐（吸收自 inklog ArchiveChain，防换盐重放）
audit-log = ["listener", "dep:sha2", "dep:hmac", "dep:getrandom", "secure-masking", "secure-ct-eq"]

# === 常量时间比较原语（CWE-208 防御）===
# 提供 `secure::ct_eq::constant_time_eq` 公共函数，基于 subtle::ConstantTimeEq。
# 所有需要常量时间比较的 feature（如 audit-log / oauth2-server）应依赖此 feature，
# 避免在各模块重复实现。
secure-ct-eq = ["dep:subtle"]

# === 安全防护套件 ===
# 统一使用 limiteron GarrisonDaoDistributedLimiter，禁止手写限流实现。
firewall = []
# bruteforce 依赖封禁存储（GarrisonDaoBanStorage 经 firewall-ddos 导出），
# 故隐含 firewall-ddos 保证 feature 自洽
firewall-bruteforce = ["firewall", "firewall-ddos", "limiteron/ban-manager"]
# lua-script：滑动窗口 Lua 脚本取自 limiteron oxcache_lua（Sorted Set 版，
# 替代 garrison 手写逗号时间戳串脚本）
firewall-ratelimit = ["firewall", "dep:rand", "limiteron/lua-script"]
# 启用后可在配置中选择 Memory/Redis 限流后端（RateLimitBackend enum）
rate-limit-redis = ["firewall-ratelimit", "cache-redis"]
firewall-anomalous = ["firewall"]
firewall-geoip = ["firewall", "limiteron/geo-matching"]
# limiteron 0.2.10 曾将 adaptive-limiting /
# priority-queue 改为 no-op 占位（模块移除），故回落到固定阈值 fixed window counter。
# limiteron 0.3.0-rc.4 起 adaptive-limiting 已恢复为真实 AIMD 实现（可评估重新接入），
# 但 priority-queue / admission-control 仍为 no-op 占位
firewall-ddos = ["firewall"]
firewall-waf = ["firewall", "web-axum"]
# 后端已迁移至 limiteron GeoMatcher（geo-matching），maxminddb 直读依赖移除；
# feature 名保持不变以兼容下游
firewall-maxminddb = ["firewall-geoip", "firewall-anomalous"]
anomalous-detector-dual = ["firewall", "listener", "dao-key-index"]
# 防护增强特性（透传 limiteron 高级能力）
firewall-gcra = ["firewall", "limiteron/gcra"]
firewall-tower = ["firewall", "limiteron/tower-middleware"]
# [INTERNAL] admission-control 在 limiteron 0.3.0-rc.4 仍为 no-op 占位（无对应模块），
# 改接已恢复真实实现的 adaptive-limiting（AIMD 自适应并发限流，错误率/慢调用反馈调窗）
firewall-admission = ["firewall", "limiteron/adaptive-limiting"]
# [INTERNAL] firewall-event 额外启用 limiteron/webhook 是编译期 workaround：
# limiteron 0.3.0-rc.4 的 event-system 在未启用 webhook 时编译失败
# （dispatcher.rs 调用点未按 cfg(feature = "webhook") 门控，E0061/E0425）。
# garrison 不注册 webhook URL 时分发器不会外发任何请求，功能惰性；
# 上游发布修复（rc.5+）后移除 limiteron/webhook。
firewall-event = ["firewall", "limiteron/event-system", "limiteron/webhook"]
firewall-monitoring = ["firewall", "limiteron/monitoring"]
firewall-parallel = ["firewall", "limiteron/parallel-checker"]
# [INTERNAL] dao-key-index：为 GarrisonDaoOxcache 维护 key 索引以提供 keys() 生产实现
# （oxcache 0.3.3 无原生 iter/keys API）。由 protocol-apikey / anomalous-detector-dual 传递启用。
dao-key-index = []

# === 安全告警系统 ===
# security-extra 为 stp 模块 safe-auth 相关门控的聚合特性。
# 注意：strategy::alert 模块在代码中实际门控于 security-extra（非 security-alert），
# security-alert 仅作为兼容别名存在（历史上曾为零依赖死 feature，导致
# device-binding / session-hijack-detection 单独启用时编译失败——测试代码编译门禁暴露）。
security-extra = []
security-alert = ["security-extra"]
device-binding = ["security-alert"]
# 会话劫持检测：check_login 路径中对比当前请求 IP 与会话创建时存储的 IP，
# 检测到不一致时广播告警事件（AlertOnly 模式）或额外踢出会话（Kickout 模式）。
# 依赖 security-alert（复用 AnomalyDetector trait + AlertListenerManager 广播链路）
# 与 auth-server（SessionHijackDetector 消费 server 中间件写入的 CLIENT_IP/UA 请求上下文）。
session-hijack-detection = ["security-alert", "auth-server"]

# === Session 增强 ===
# 合并 anonymous-session + session-search + dynamic-active-timeout + login-token-map-persistence → session-extra
session-extra = []

# === 三层缓存架构 ===
three-tier-cache = ["dep:oxcache"]

# === 社交登录 ===
social-wechat = ["protocol-oauth2"]
# 启用 rsa（RSA2 签名 + PEM 解析）+ base64（签名值编码）
social-alipay = ["protocol-oauth2", "dep:rsa", "dep:base64", "protocol-zeroize"]

# === Keycloak OIDC RP ===
keycloak-oidc = ["protocol-oidc"]

# === 微服务架构 ===
backend-embedded = []
backend-remote = ["dep:reqwest", "limiteron/circuit-breaker", "limiteron/fallback"]
# secure-simple-token：为 SimpleTokenStyle 启用 HMAC-SHA256 签名
# 格式：<login_id>-<uuid>.<hmac_sha256(secret, login_id|uuid)>
# 未启用此 feature 时，SimpleTokenStyle::generate 返回 Err（fail-closed，杜绝无签名伪造）
secure-simple-token = ["dep:sha2", "dep:hmac", "dep:subtle"]
auth-server = ["web-axum", "backend-embedded", "auth-server-sdforge", "dep:subtle", "secure-simple-token", "dep:mimalloc", "server-graceful-shutdown"]
# dep:sha2：决策缓存 key 的 context_json 摘要成分（SHA-256 前 16 字节）
abac = ["dep:cedar-policy", "cache-memory", "dep:sha2"]
# db-sqlite 下的 RefreshTokenRotation 依赖 protocol::jwt，因此传递启用 protocol-jwt。
oauth2-server = ["protocol-oauth2", "dep:reqwest", "dep:argon2", "dep:rand", "dep:getrandom", "dep:percent-encoding", "protocol-jwt", "secure-ct-eq"]

# === inklog 结构化审计日志 ===
audit-inklog = ["inklog/fast-masking", "inklog/compression"]
audit-inklog-http = ["audit-inklog", "inklog/http"]
# SIEM/SOC 实时外送（吸收 inklog/net-sink）：TCP（可 TLS）+ UDP 转发，断线缓冲重连。
# TLS 为上游 MVP（支持 danger_accept_invalid_certs 豁免项，生产慎用）
audit-inklog-siem = ["audit-inklog", "inklog/net-sink"]

# === trait-kit typestate DI 构建 ===
backend-kit = ["backend-embedded", "trait-kit/lifecycle", "trait-kit/health", "trait-kit/observer"]
backend-shutdown = ["backend-kit", "trait-kit/shutdown"]

# === sdforge 声明式路由 ===
# [INTERNAL] `http` feature 是 garrison 与 sdforge 之间的桥接 feature（cfg flag only）：
# `#[forge]` 宏生成的 `inventory::submit!(RouteRegistration::new(...))` 被
# `#[cfg(feature = "http")]` 保护，此 cfg 在 **garrison 上下文** 求值（不是 sdforge）。
# 若 garrison 不暴露 `http` feature，submit 调用会被 cfg 剥离，
# `sdforge::http::build()` 收集不到任何路由 → 所有 POST 请求返回 404。
# 命名约定：必须叫 `http`（sdforge 宏硬编码 `feature = "http"`），不可改名。
# sdforge/http 由依赖声明 `features = ["http"]` 无条件启用，故此 feature 仅作 cfg 开关。
http = []
# dep:sdforge：auth-server 的 sdforge 面在此激活（http 为宏镜像 marker）
auth-server-sdforge = ["http", "dep:sdforge"]

# === 可观测性 ===
listener = []
credit-metering = ["listener"]
tracing-log = ["tracing/log", "dep:tracing-subscriber"]
metrics-prometheus = ["dep:prometheus", "dep:tracing-subscriber"]
# [INTERNAL] OpenTelemetry 分布式追踪（OTLP gRPC 导出），独立门控以隔离重依赖
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-subscriber"]
grpc = ["dep:tonic", "dep:tonic-health", "dep:tower", "sdforge/grpc"]
# 基础层已无条件编译，此 feature 仅门控 i18n 相关测试代码，不改变运行时行为。
i18n = []
# ICU4X 增强层：复数规则 + 日期/数字本地化（依赖 i18n 基础层）
i18n-icu = [
    "i18n",
    "dep:icu_plurals", "dep:icu_datetime", "dep:icu_decimal",
    "dep:icu_locale_core", "dep:icu_calendar", "dep:icu_time", "dep:fixed_decimal",
]
# 启用后 GarrisonError 实现 miette::Diagnostic trait（保留 thiserror::Error derive）
miette = ["dep:miette"]
garrison-testing = ["authorize-api"]
testing = []

# === 聚合特性 ===
full = [
    "cache-memory", "cache-redis",
    "db-sqlite",
    "protocol-oauth2", "protocol-sso", "protocol-jwt", "protocol-sign", "protocol-apikey", "protocol-temp", "protocol-invitation", "protocol-zeroize",
    "protocol-oidc", "oauth2-scope-handler", "protocol-sso-server", "protocol-saml",
    "secure-totp", "secure-sign", "protocol-httpbasic", "protocol-httpdigest", "secure-masking",
    "secure-xss", "secure-sanitize", "sms-rate-limit", "email-verification", "email-verification-smtp",
    "account-credential", "credential-zeroize", "account-policy", "account-lockout", "account-authflow",
    "web-axum", "web-actix", "web-warp",
    "web-security",
    "alone-cache", "parameter-query",
    "listener", "metrics-prometheus", "otlp", "grpc", "i18n-icu",
    "audit-inklog", "audit-inklog-siem",
    "annotation-macros",
    "core-advanced", "tenant-isolation",
    "firewall", "firewall-bruteforce", "firewall-ratelimit", "firewall-anomalous",
    "firewall-geoip", "firewall-ddos", "firewall-maxminddb", "firewall-waf",
    "rate-limit-redis",
    "anomalous-detector-dual",
    "security-alert",
    "session-hijack-detection",
    "security-extra",
    "device-binding",
    "session-extra",
    "three-tier-cache",
    "social-wechat", "social-alipay",
    "backend-embedded", "backend-kit", "backend-shutdown", "backend-remote", "auth-server", "auth-server-sdforge", "abac", "oauth2-server",
    "credit-metering",
    "server-health-check", "server-graceful-shutdown",
    "config-full",
    "db-retry", "cache-lock", "cache-invalidation", "ban-sync", "cache-audit",
    "api-docs",
    # 自研库特性吸收
    "config-yaml", "config-audit", "config-consul", "config-etcd", "config-distributed",
    "db-sharding", "db-replica", "db-saga",
    "firewall-gcra", "firewall-tower", "firewall-admission", "firewall-event", "firewall-monitoring", "firewall-parallel",
    "cache-batch", "audit-inklog-http",
]

# production 使用 db-postgres（dbnexus 0.3+ 已支持 postgres feature）
production = [
    "cache-redis", "db-postgres", "web-axum",
    "protocol-jwt", "protocol-sign", "secure-sign",
    "listener", "tracing-log", "metrics-prometheus",
    "audit-inklog",
    "tenant-isolation",
    "security-alert", "session-hijack-detection", "security-extra", "device-binding",
    "core-advanced",
    "firewall-waf",
    "three-tier-cache",
    "sms-rate-limit",
    "backend-embedded", "backend-kit", "auth-server", "auth-server-sdforge", "abac",
    "api-docs",
    # 自研库特性吸收（生产环境）
    "config-yaml", "config-distributed", "config-audit",
    "db-sharding", "db-replica",
    "firewall-gcra", "firewall-tower", "firewall-monitoring", "firewall-parallel",
    "cache-batch", "cache-audit",
]

development = [
    "cache-memory", "db-sqlite", "web-axum",
]

# === 示例文件位于独立 workspace member（examples/），详见 examples/Cargo.toml ===

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic 改为 unwind（原 "abort"）。
# src/listener（插件广播隔离）、src/protocol/sso/channel.rs（SSO 订阅 handler）
# 依赖 std::panic::catch_unwind 实现“隔离单个任务 panic、避免污染全局状态”——
# abort 下该语义退化为整个认证节点终止，多租户/高并发部署单 listener panic
# 即全服务下线。unwind 恢复隔离语义；体积/性能代价（fat LTO 下）可接受，
# 认证基础设施可用性优先。
panic = "unwind"

# === 测试目标 ===

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
required-features = ["full"]

# === 数据库后端专用验收（dbnexus embedded/server-side 互斥的覆盖补齐） ===
# full 聚合只含 db-sqlite（embedded），environment.rs 的 Postgres/MySQL
# 真实服务路径在 full 面下被 cfg 剥离、永不可达。
# 经独立 target 以单 db 特性面执行（拆分为 postgres/mysql 两个 target：
# required-features 是 AND 语义，单 target 无法表达「二选一」，
# 且 db-postgres 与 db-mysql 均为 server-side、无需绑定出现）。
# 由 scripts/e2e_matrix.sh S3 配合 docker-compose.e2e.yml / testcontainers 执行。
[[test]]
name = "acceptance_db_postgres"
path = "tests/acceptance_db_postgres.rs"
required-features = ["db-postgres"]

[[test]]
name = "acceptance_db_mysql"
path = "tests/acceptance_db_mysql.rs"
required-features = ["db-mysql"]

# === 二进制目标 ===
[[bin]]
name = "auth_server"
path = "src/bin/auth_server.rs"
# cache-memory：bin 使用 GarrisonDaoOxcache（oxcache DAO 实现门控于 cache-memory），
# 缺失会导致 --features auth-server 单独面编译失败（E0432）
required-features = ["auth-server", "cache-memory"]

# === 基准测试目标 ===
[[bench]]
name = "garrison_benchmark"
path = "benches/garrison_benchmark.rs"
harness = false
# bench 文档化用法即 --features full（见 benches/garrison_benchmark.rs 头注）；
# 声明后 CI 的 full 口径 clippy/test 即自然覆盖 bench 目标。
required-features = ["full"]

# === Lint 配置 ===
# sdforge #[forge] 宏在 garrison 中展开时生成 #[cfg(feature = "mcp")] /
# #[cfg(feature = "cli")] / #[cfg(feature = "openapi")] 等代码，
# garrison 不具备这些 feature，通过 check-cfg 显式登记这些外部 cfg 值，
# 将 unexpected_cfgs 保持为 warn 级别（而非 allow）以便发现真正的意外 cfg。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("abac", "account-authflow", "account-credential", "account-lockout", "account-policy", "alone-cache", "annotation-macros", "anomalous-detector-dual", "audit-inklog", "audit-inklog-http", "audit-inklog-siem", "audit-log", "authorize-api", "auth-server", "auth-server-sdforge", "backend-embedded", "backend-kit", "backend-remote", "ban-sync", "cache-audit", "cache-batch", "cache-invalidation", "cache-memory", "cache-redis", "cli", "config-audit", "config-consul", "config-distributed", "config-etcd", "config-schema", "config-security-rules", "config-yaml", "core-advanced", "credential-zeroize", "credit-metering", "dao-key-index", "db-mysql", "db-postgres", "db-replica", "db-saga", "db-sharding", "db-sqlite", "device-binding", "embedded-migrations", "firewall", "firewall-admission", "firewall-anomalous", "firewall-bruteforce", "firewall-ddos", "firewall-event", "firewall-geoip", "firewall-gcra", "firewall-maxminddb", "firewall-monitoring", "firewall-parallel", "firewall-ratelimit", "firewall-tower", "firewall-waf", "full", "garrison-testing", "grpc", "i18n", "i18n-icu", "keycloak-oidc", "listener", "manager-explicit", "mcp", "metrics-prometheus", "miette", "oauth2-scope-handler", "oauth2-server", "openapi", "otlp", "parameter-query", "policy-hibp", "protocol-apikey", "protocol-httpbasic", "protocol-httpdigest", "protocol-jwt", "protocol-oauth2", "protocol-oidc", "protocol-saml", "protocol-sign", "protocol-sso", "protocol-sso-server", "protocol-temp", "protocol-zeroize", "rate-limit-redis", "secure-confusable", "secure-ct-eq", "secure-masking", "secure-sanitize", "secure-sign", "secure-simple-token", "secure-totp", "secure-xss", "security-extra", "session-extra", "session-hijack-detection", "sms-rate-limit", "social-alipay", "social-wechat", "tenant-isolation", "testing", "three-tier-cache", "tls", "tracing-log", "web-actix", "web-axum", "web-cors", "web-csrf", "web-security-headers", "web-warp"))',
] }

# === 本地 base 库桥接（⚠️ 临时，上游发布后拆除） ===
# 承载尚未发布至 crates.io 的 base 修复：
# - limiteron：GeoMatcher 文件大小下限降级为告警（Country/测试库合法地只有几十 KB）、
#   lookup 对库外 IP 返回 GeoInfo::empty()（负缓存）而非 Err
# - confers：load_file 补 is_file 特殊文件拒绝 + take(max+1) I/O 双保险 +
#   redact_error_paths 错误路径脱敏；EnvSource 新增 exclude_keys
# 【拆除条件】limiteron 0.3.0-rc.5 与 confers 0.6.0-rc.5 发布后：删除本节，
# 并将 [dependencies] 中两库 req 升至 rc.5。
[patch.crates-io]
limiteron = { path = "../base/limiteron" }
confers = { path = "../base/confers" }
