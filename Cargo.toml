[package]
name = "garrison"
version = "0.9.0-rc.4"
edition = "2021"
rust-version = "1.97.1"  # MSRV: 依赖面兄弟生态 rc 线（confers/oxcache/dbnexus/sdforge/limiteron/inklog/trait-kit）各自声明 rust-version = "1.97.1"，此为依赖图可满足的最低工具链；CI 测试矩阵 MSRV 腿同版验证
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
description = "Garrison - 面向 Rust 生态的一站式身份认证鉴权框架"
repository = "https://github.com/Kirky-X/garrison"
documentation = "https://docs.rs/garrison"
readme = "README.md"
keywords = ["auth", "authentication", "authorization", "jwt", "rbac"]
categories = ["authentication", "web-programming"]

[workspace]
members = [".", "examples", "macros"]
resolver = "2"

[workspace.package]
version = "0.9.0-rc.4"
edition = "2021"
rust-version = "1.97.1"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/garrison"
documentation = "https://docs.rs/garrison"

[workspace.dependencies]
garrison = { path = ".", default-features = false }
garrison-macros = { version = "0.9.0-rc.4", path = "macros", default-features = false }
axum = { version = "0.8", default-features = false, features = ["json"] }
actix-web = { version = "4.12", default-features = false }
warp = { version = "0.4", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
oxcache = { version = "0.5.0-rc.10", default-features = false }
dbnexus = { version = "0.6.0-rc.10", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
# thread_rng 蕴含 std + std_rng + sys_rng（rand 0.10.3），代码仅用 rand::rng()/RngExt，无需重复声明
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
wiremock = { version = "0.6", default-features = false }
http-body-util = { version = "0.1", default-features = false }
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }

[lib]
name = "garrison"
path = "src/lib.rs"

[dependencies]
# Required dependencies
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
confers = { version = "0.6.0-rc.11", default-features = false }
tokio = { version = "1.53", default-features = false, features = ["sync", "macros", "rt-multi-thread", "time", "signal"] }
inventory = { version = "0.3", default-features = false }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
async-trait = { version = "0.1", default-features = false }
parking_lot = { version = "0.12", default-features = false }
arc-swap = { version = "1.9", default-features = false }
dashmap = { version = "6.2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1.26", default-features = false, features = ["std", "v4", "v7", "serde"] }
http = { version = "1.5", default-features = false, features = ["std"] }
# warp request id 后置回填（web-warp feature）：收集错误响应体解析注入 request_id
http-body-util = { optional = true, workspace = true }
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }

# Optional dependencies (feature-gated)
axum = { optional = true, default-features = false, features = ["json"], workspace = true }
axum-server = { version = "0.8", optional = true, default-features = false }
# axum-server 不 re-export rustls：tls 路径须先安装进程级 CryptoProvider（ring 与 aws-lc-rs 并存会 panic）
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws-lc-rs"] }
actix-web = { optional = true, default-features = false, workspace = true }
warp = { optional = true, default-features = false, workspace = true }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"], optional = true }
reqwest = { optional = true, default-features = false, features = ["json", "rustls", "form"], workspace = true }
totp-rs = { version = "6.0", optional = true, default-features = false, features = ["alloc"] }
# 核心依赖：session key 摘要化（CWE 存储凭据面），feature 不再重复声明
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", optional = true, default-features = false }
# 审计链盐/链哈希的 hex 编解码（经 limiteron/audit-log 传递引入，非新增 crate）
hex = { version = "0.4", optional = true, default-features = false, features = ["alloc"] }
subtle = { version = "2.6", optional = true, default-features = false, features = ["std"] }
base64 = { version = "0.23", optional = true, default-features = false, features = ["std"] }
md5 = { version = "0.8", optional = true, default-features = false }
base32 = { version = "0.5", optional = true, default-features = false }
argon2 = { version = "0.6", optional = true, default-features = false, features = ["alloc", "getrandom", "password-hash"] }
# zeroize：bcrypt 计算后对内部 72 字节密码栈缓冲清零（bcrypt 默认特性之一，关闭则静默失去该安全属性）
bcrypt = { version = "0.19", optional = true, default-features = false, features = ["std", "zeroize"] }
rand = { optional = true, workspace = true }
# rand 0.10 移除 OsRng：字节随机路径改用 getrandom::fill 读 OS CSPRNG
getrandom = { version = "0.4", optional = true, default-features = false }
zeroize = { version = "1.9", optional = true, default-features = false, features = ["derive", "serde"] }
regex = { version = "1.13", optional = true, default-features = false }
# optional：常驻使用点 three-tier-cache 显式 dep:oxcache；dao/oxcache_impl 与 abac 经 oxcache/* 引用自动激活
oxcache = { version = "0.5.0-rc.10", default-features = false, optional = true }
# dbnexus 0.4+ 强制至少一个驱动 feature，故必须 optional，由 db-base 透传
dbnexus = { optional = true, default-features = false, workspace = true }
# loom 竞态验证：用 feature 门控而非 RUSTFLAGS --cfg loom，避免 cfg 泄漏令 tokio 剔除 net
loom = { version = "0.7", default-features = false, features = ["futures"], optional = true }
prometheus = { version = "0.14", optional = true, default-features = false }
tracing-subscriber = { optional = true, default-features = false, features = ["fmt", "json", "env-filter"], workspace = true }
opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", optional = true, default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = ["trace", "grpc-tonic"] }
tonic = { optional = true, default-features = false, features = ["transport"], workspace = true }
tonic-health = { version = "0.14", optional = true, default-features = false }
# grpc：GarrisonGrpcAuthLayer 的 tower Layer/Service；#[forge] 路由共用 tonic 栈
tower = { version = "0.5", optional = true, default-features = false }
fluent = { version = "0.17", default-features = false }
unic-langid = { version = "0.9", default-features = false }
# 系统语言探测：i18n detect_locale 检测链末端（env 链未命中时读取 OS locale）
sys-locale = { version = "0.3", default-features = false }
miette = { version = "7.6", optional = true, default-features = false }
garrison-macros = { optional = true, workspace = true }
# rsa 0.9 依赖 sha2 0.10，与项目 0.11 不兼容；用 rsa::sha2 re-export
rsa = { version = "0.9", optional = true, default-features = false, features = ["sha2", "pem", "getrandom"] }
unicode-security = { version = "0.1", optional = true, default-features = false }
# IP 白名单 CIDR 解析（account-authflow 的 IpWhitelisted 条件真实求值）
ipnetwork = { version = "0.21", optional = true, default-features = false }
# HIBP k-anonymity 前缀哈希（policy-hibp 使用；sha2 0.11 不再含 Sha1，需独立 sha1 0.11 稳定版）
sha1 = { version = "0.11", optional = true, default-features = false }
quick-xml = { version = "0.42", default-features = false, features = ["serialize"], optional = true }
# 版本与 oxcache 0.5 的 redis 间接依赖保持一致，避免双版本共存

futures = { version = "0.3", default-features = false, features = ["std"] }
# mimalloc 全局分配器（auth_server 二进制使用，多线程分配性能优于系统默认分配器）
mimalloc = { version = "0.1", optional = true, default-features = false }
# optional 化：唯一使用点 observability/inklog（audit-inklog 门控），其 inklog/* 引用自动激活。
inklog = { version = "0.3.0-rc.10", default-features = false, optional = true }
# retry 供 stp 会话 JWT 黑名单退避调度（delay_for_attempt，空 feature 零依赖）；distributed 供防火墙限流/双窗口限速的分布式滑窗桥接
limiteron = { version = "0.3.0-rc.8", default-features = false, features = ["distributed", "retry"] }
# sdforge 运行时：必须暴露同名 http feature（#[forge] 宏在 garrison 上下文求值 cfg）；仅 auth-server 启用
sdforge = { version = "0.5.0-rc.9", default-features = false, features = ["http"], optional = true }
trait-kit = { version = "0.5.0-rc.10", default-features = false, features = ["async"] }
cedar-policy = { version = "4.13", default-features = false, optional = true }
icu_plurals = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_datetime = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_decimal = { version = "2.3", default-features = false, features = ["compiled_data", "alloc"], optional = true }
icu_locale_core = { version = "2.3", default-features = false, optional = true }
icu_calendar = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_time = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
fixed_decimal = { version = "0.7", optional = true, default-features = false }
percent-encoding = { version = "2.3", optional = true, default-features = false }
hkdf = { version = "0.13", optional = true, default-features = false }
# pkcs1/pkcs8：JWT RS 系验证路径从私钥 PEM 提取公钥组件（n,e）；纯 DER 解析库（无 RSA 运算，与 RUSTSEC-2023-0071 无关），本为 rsa 传递依赖
pkcs1 = { version = "0.7", optional = true, default-features = false, features = ["std", "pem", "pkcs8"] }
pkcs8 = { version = "0.10", optional = true, default-features = false, features = ["std", "pem", "alloc"] }
# ES 系验证路径的公钥点计算（曲线标量乘法），见 protocol-jwt 注释
p256 = { version = "0.13", optional = true, default-features = false, features = ["arithmetic", "std"] }
p384 = { version = "0.13", optional = true, default-features = false, features = ["arithmetic", "std"] }
sec1 = { version = "0.7", optional = true, default-features = false, features = ["std", "der"] }
# Ed25519 验证路径的公钥计算（RFC 8410 种子 → 公钥）；2.2.0 已修 RUSTSEC-2022-0093（≥2.0）
ed25519-dalek = { version = "2.2", optional = true, default-features = false, features = ["fast"] }
# 嵌入式迁移文件（embedded-migrations）：编译时 include_dir! 嵌入 postgres 迁移 SQL，crates.io 消费者运行时无需访问源码目录即可迁移
include_dir = { version = "0.7", optional = true, default-features = false }
tempfile = { version = "3.27", optional = true, default-features = false, features = ["getrandom"] }
# email-verification-smtp：内置 SMTP；也可仅开 email-verification 自行实现
lettre = { version = "0.11", optional = true, default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls", "hostname"] }
# WebAuthn：注册/认证仪式 + ExcludeCredentials；锁 0.5.5 与 core 同版
# passkey 子特性：attestation 解析 / 条件式 UI / 仪式态序列化仅限服务端 / Credential 互转
webauthn-rs = { version = "0.5", optional = true, default-features = false, features = ["attestation", "conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals"] }
# webauthn-rs-core：同版本核心类型，锁定 =0.5.5 与 wrapper 严格同版
webauthn-rs-core = { version = "=0.5.5", optional = true, default-features = false }
# garrison-cli 运维子命令（cli-ops）：derive API + 人类可读输出；独立运维 bin 门控，不进 auth_server/healthcheck
clap = { version = "4.6", optional = true, default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
# field-encryption：AES-256-GCM + AAD 租户绑定；nonce 由 getrandom 自产
aes-gcm = { version = "0.11", optional = true, default-features = false, features = ["aes", "alloc"] }

[dev-dependencies]
once_cell = "1.21"
toml = "1.1"
tokio-test = "0.4"
mockall = "0.15"
# 日志断言（refresh 退化路径 warn 验收）：fmt/json/env-filter，registry().with(fmt Layer + 自定义 writer) 捕获事件
tracing-subscriber = { workspace = true }
# tempfile 同时在 dependencies（optional）与 dev-dependencies，Cargo 允许
tempfile = "3.27"
# serial_test 用于串行化依赖 std::env::set_var 的测试，避免多线程并发污染环境变量
serial_test = "4.0"
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = { workspace = true }
wiremock = { workspace = true }
warp = { default-features = false, features = ["test"], workspace = true }
# 测试用 OsRng：rand 0.10 已移除，rsa 0.9 keygen 基于 rand_core 0.6
rsa = { version = "0.9", features = ["getrandom"] }
rand = { workspace = true }
testcontainers = "0.28"
criterion = { version = "0.8", features = ["html_reports"] }
# rcgen 用于 BackendRemote mTLS 测试中生成自签名证书
rcgen = "0.14"
# tls-cert-watch 测试需显式安装 rustls CryptoProvider（aws-lc-rs 与 ring 并存会 panic）
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# 集成测试直接发送 HTTP 请求故无条件引入；cookies 供 keycloak_fixture 以 cookie jar 驱动真实登录表单流
reqwest = { default-features = false, features = ["json", "rustls", "cookies"], workspace = true }
# macros UI 测试：trybuild 子项目继承父 dev-deps，annotation-macros 由测试面透传
trybuild = "1.0"
axum = { version = "0.8", default-features = false }

[features]
default = ["backend-embedded"]

# 核心模块（always on，无开关）：core/stp/annotation/router/dao/session/manager/plugin 等

# 核心扩展：决策溯源 / 权限注册表 / forbid 优先语义
# 合并 decision-trace + permission-registry + safe-defaults → core-advanced
core-advanced = []

# 核心扩展：请求对象式授权 API
authorize-api = ["core-advanced"]

# 核心扩展：显式 Manager API
manager-explicit = ["authorize-api"]

# 核心扩展：多租户逻辑隔离
# Repository SQL 过滤不门控此 feature（始终生效，安全优先）
tenant-isolation = ["limiteron/multi-tenant"]

# 配置增强（confers 透传）
config-encryption = ["confers/encryption"]
config-validation = ["confers/validation"]
config-hot-reload = ["confers/watch"]
config-interpolation = ["confers/interpolation"]
config-dynamic = ["confers/dynamic"]
config-toggle = ["confers/feature-toggle"]
# 配置增强特性（透传 confers 高级能力）
config-yaml = ["confers/yaml"]
config-audit = ["confers/audit"]
config-consul = ["confers/consul"]
config-etcd = ["confers/etcd"]
config-distributed = ["confers/distributed"]
config-schema = ["confers/schema"]
# 一键启用全部配置增强
config-full = ["config-encryption", "config-validation", "config-hot-reload", "config-interpolation", "config-dynamic", "config-toggle", "config-yaml", "config-audit", "config-consul", "config-etcd", "config-distributed", "config-schema", "config-security-rules"]
# 配置安全校验器（吸收 confers/security-rules）：JWT 密钥强度 / CORS / SSRF / TLS
# 内置校验器 + SecurityValidator 注册表，配置加载期 fail-fast
config-security-rules = ["confers/security-rules"]

# 缓存后端（通过 oxcache）
cache-memory = ["oxcache/memory", "oxcache/serialization", "oxcache/metrics", "oxcache/bloom"]
# 缓存审计事件（oxcache/audit）：hit/miss/set/delete 经 tracing 发布，键名脱敏
cache-audit = ["cache-memory", "oxcache/audit", "oxcache/telemetry"]
cache-redis = ["cache-memory", "oxcache/redis", "oxcache/lua", "oxcache/pubsub", "oxcache/compression"]
cache-lock = ["cache-redis", "oxcache/lock"]
cache-batch = ["cache-memory", "oxcache/batch"]
# 跨实例缓存一致性：oxcache 键空间通知失效（多实例部署下 L1 自动同步）
cache-invalidation = ["cache-redis", "oxcache/invalidation"]
# 缓存热 key 采样观测（oxcache/hotkey）：进程内 HotKeyTracker 独立于读写路径，three_tier L1 埋点 + hot_keys_top(k) 诊断
cache-hotkey = ["oxcache/hotkey"]
# 封禁记录跨实例同步：limiteron 经 oxcache Pub/Sub 广播封禁变更
ban-sync = ["limiteron/ban-sync", "cache-invalidation"]

# 数据库后端（通过 dbnexus）
# [INTERNAL] dbnexus 禁止 embedded 与 server-side 混用。
db-base = [
    "dep:dbnexus",
    "dbnexus/runtime-tokio-rustls",
    "dbnexus/permission",
    "dbnexus/sql-parser",
    "dbnexus/macros",
    "dbnexus/config-env",
    "dbnexus/with-time",
    "dbnexus/auto-migrate",
    "dbnexus/pool-health-check",
    "dbnexus/with-uuid",
    "dbnexus/with-chrono",
    "dbnexus/pool-warmup",
    "dbnexus/failover",
    "dbnexus/observability",
]
# db-sqlite 启用 sqlite embedded 驱动
db-sqlite = ["db-base", "dbnexus/sqlite"]
db-postgres = ["db-base", "dbnexus/postgres", "embedded-migrations"]
db-mysql = ["db-base", "dbnexus/mysql"]
db-retry = ["db-base", "dbnexus/retry"]
# 数据库增强特性（透传 dbnexus 高级能力）：sharding = 分片 + 分布式 ID + scatter-gather 并行查询
db-sharding = ["db-base", "dbnexus/sharding", "dbnexus/distributed-id", "dbnexus/scatter-gather"]
db-replica = ["db-base", "dbnexus/replica-routing"]
db-saga = ["db-sharding", "dbnexus/saga"]

# 嵌入式迁移文件：编译时 include_dir! 嵌入 postgres 迁移 SQL，消费者运行时无需访问 garrison 源码目录
embedded-migrations = ["dep:include_dir", "dep:tempfile"]

# 协议层插件
protocol-oauth2 = ["dep:reqwest", "dep:base64", "dep:percent-encoding"]
# protocol-sso 隐含 protocol-jwt：OIDC exchange_code 必须验签 id_token（fail-closed）。
protocol-sso = ["dep:reqwest", "dep:quick-xml", "dep:hmac", "dep:base64", "dep:percent-encoding", "protocol-jwt"]
# protocol-jwt：签发/校验/刷新；pkcs1/pkcs8/p256 均为 jsonwebtoken 传递依赖，无新增体积
protocol-jwt = ["dep:jsonwebtoken", "dep:hkdf", "dep:pkcs1", "dep:pkcs8", "dep:base64", "dep:p256", "dep:p384", "dep:sec1", "dep:ed25519-dalek"]
protocol-sign = ["dep:hmac", "dep:base64", "dep:hkdf"]
# protocol-apikey：生成/校验/吊销/轮换；secret SHA-256 存储 + 常量时间比较
protocol-apikey = ["secure-ct-eq", "dao-key-index"]
protocol-temp = []
# protocol-qrlogin：两票分离状态机 + HMAC 票据；confirm_token 存 SHA-256 摘要
protocol-qrlogin = ["dep:hmac", "dep:base64", "dep:subtle"]
# loom-test：竞态测试集（默认关）；传递 protocol-temp/protocol-jwt/db-sqlite，否则编译不到用例
loom-test = ["dep:loom", "protocol-temp", "protocol-jwt", "db-sqlite"]
# data-erasure：数据主体擦除编排（GDPR/个保法删除权的框架侧能力，compliance 模块）
data-erasure = []
# protocol-invitation：邀请码定向注册（一次性/N 次、TTL、吊销、防爆破、注册编排钩子）；dep:rand 短码随机、sha2 防爆破计数键 source 摘要
protocol-invitation = ["dep:rand"]
# protocol-zeroize：Drop 清零 secret；rsa/zeroize 使私钥实现 Zeroize
protocol-zeroize = ["dep:zeroize"]
# OIDC 扩展（id_token 签发/验证 + discovery endpoint），依赖 protocol-jwt + protocol-oauth2
protocol-oidc = ["protocol-jwt", "protocol-oauth2", "dep:subtle"]
# OAuth2 Scope Handler 注册表（ScopeHandler trait + ScopeRegistry），依赖 protocol-oauth2
oauth2-scope-handler = ["protocol-oauth2"]
# SSO Server 独立抽象（SsoServer trait + CenterIdConverter + SsoChannel），依赖 protocol-sso
protocol-sso-server = ["protocol-sso"]
# protocol-saml：启用 XmlSecSamlProvider，使用 rsa crate 验证 SAML Assertion XML 签名
# dep:subtle：DigestValue 比对使用常量时间比较
protocol-saml = ["protocol-sso", "dep:rsa", "dep:base64", "dep:subtle"]
# protocol-webauthn：WebAuthn/Passkey 凭据 SPI 与注册/认证仪式（challenge 防重放/sign_count 克隆检测/backup flags）
protocol-webauthn = ["dep:webauthn-rs", "dep:webauthn-rs-core"]

# 安全模块
secure-totp = ["dep:totp-rs", "dep:base32"]
# secure-ct-eq：签名校验常量时间比较统一走公共原语（ADR-0003 决策 2）
secure-sign = ["dep:hmac", "dep:base64", "secure-ct-eq"]
# 域统一到协议层（原 secure-httpbasic）
protocol-httpbasic = ["dep:base64"]
# 域统一到协议层（原 secure-httpdigest）
# secure-ct-eq：Digest response/uri/nonce 校验统一走常量时间比较
protocol-httpdigest = ["dep:base64", "dep:md5", "secure-ct-eq", "dep:hkdf", "dep:hmac"]
# Unicode 同形异义字检测
secure-confusable = ["dep:unicode-security"]
# 依赖 regex：Custom mask 真实脱敏（原 placeholder 实现静默泄露敏感数据）
secure-masking = ["dep:regex"]
secure-xss = []
secure-sanitize = []
# secure-ct-eq：验证码比对走公共常量时间比较原语（ADR-0003 决策 2，消除第二实现与本地 fallback）
sms-rate-limit = ["dep:rand", "secure-ct-eq"]
# 邮箱验证码（基础 trait + service + rate_limiter，业务方自行实现 EmailSender）
# secure-ct-eq：验证码比对走公共常量时间比较原语（ADR-0003 决策 2，消除第二实现与本地 fallback）
email-verification = ["dep:rand", "secure-ct-eq"]
# 邮箱验证码 SMTP 内置实现（lettre，含 SmtpEmailSender）
email-verification-smtp = ["email-verification", "dep:lettre"]
# field-encryption：AES-256-GCM 静态加密 + AAD 租户绑定；nonce 直读 OS CSPRNG，key 名 SHA-256 摘要
# mfa-recovery：MFA 恢复码管理器（SHA-256 哈希落库）
field-encryption = ["dep:aes-gcm", "dep:getrandom", "dep:base64"]
mfa-recovery = []

# 账号安全引擎
# secure-ct-eq：备份码哈希比对统一走常量时间比较原语（消除本地 ct_eq_hex）
account-credential = ["dep:argon2", "dep:bcrypt", "dep:rand", "dep:getrandom", "dep:base32", "secure-ct-eq"]
credential-zeroize = ["account-credential", "dep:zeroize"]
account-policy = ["account-credential", "dep:regex"]
account-lockout = ["firewall"]
account-authflow = ["account-credential", "account-policy", "account-lockout", "dep:ipnetwork"]
# account-password-reset：一次性 ActionToken + 防枚举/防竞态，依赖均为既有 feature
account-password-reset = ["protocol-jwt", "account-credential", "account-policy", "email-verification"]
# HIBP 泄露密码检查（k-anonymity range search，网络调用；关闭时返回显性错误）
policy-hibp = ["dep:reqwest", "dep:sha1"]

# Web 框架适配
web-axum = ["dep:axum", "axum/tokio", "axum/http1"]
web-actix = ["dep:actix-web"]
web-warp = ["dep:warp", "dep:http-body-util"]

# HTTPS/TLS 终止（axum-server rustls）
# 依赖 auth-server（server 模块门控）
tls = ["dep:axum-server", "axum-server/tls-rustls", "dep:rustls", "auth-server"]
# tls-cert-watch：confers MultiFsWatcher 监听证书变更并热重载，无需重启
tls-cert-watch = ["tls", "confers/watch"]

# Server 增强
# server-health-check：接线 /healthz /readyz 探针（路由最外层，绕过限流/审计）
server-health-check = ["auth-server", "sdforge/health"]
# graceful shutdown：SIGTERM/SIGINT 后停止接收新连接并 drain 在途请求；auth-server 聚合默认包含
server-graceful-shutdown = []

# Web 安全中间件
web-cors = ["web-axum"]
web-csrf = ["web-axum", "dep:rand", "dep:getrandom", "dep:base64", "secure-ct-eq"]
# HTTP 安全响应头中间件（X-Content-Type-Options / X-Frame-Options / HSTS / Cache-Control）
web-security-headers = ["web-axum"]
# Web 安全中间件聚合（CORS + CSRF + 安全响应头）
web-security = ["web-cors", "web-csrf", "web-security-headers"]

# 过程宏注解（#[check_login]/#[check_permission]/#[check_role]）
# 依赖 web-axum（宏生成的 wrapper 返回 axum::response::Response）
annotation-macros = ["dep:garrison-macros", "web-axum"]

# 扩展
# AloneCache 装饰器：DAO 层单飞缓存（dao::alone_cache，未命中再加锁回源，防击穿）
alone-cache = []
# STP 参数化查询：strategy 层 parameter 模块（按参数占位符构造查询）
parameter-query = []
api-docs = ["sdforge/openapi"]
# cli-ops：garrison-cli 运维 bin（healthcheck/key-rotate/user-hash/one-time-access-token 子命令）。
# 独立运维工具门控，不进默认容器镜像；auth_server/healthcheck bin 保持零 clap（见 docs/DEVELOPMENT.md）
cli-ops = ["dep:clap"]

# 审计日志
# audit-log：链首随机盐 + limiteron HMAC 链内核；依赖均为既有
audit-log = ["listener", "dep:hmac", "dep:hex", "dep:getrandom", "secure-masking", "secure-ct-eq", "limiteron/audit-log"]

# 常量时间比较原语（CWE-208）：ct_eq 统一入口，禁止本地实现或直连 dep:subtle
secure-ct-eq = ["dep:subtle"]

# 安全防护套件
# 统一使用 limiteron GarrisonDaoDistributedLimiter，禁止手写限流实现。
firewall = []
# bruteforce 依赖封禁存储（GarrisonDaoBanStorage 经 firewall-ddos 导出），故隐含 firewall-ddos 保证 feature 自洽
firewall-bruteforce = ["firewall", "firewall-ddos", "limiteron/ban-manager"]
# lua-script：滑动窗口 Lua 取自 limiteron；adaptive-threshold 为 AIMD 内核
firewall-ratelimit = ["firewall", "dep:rand", "limiteron/lua-script", "limiteron/adaptive-threshold"]
# 驱动登录防火墙 hook 与 RateLimitStrategy 的 Redis 限流运行时（独立于会话 DAO）；
# 启用后可在配置中选择 Memory/Redis 限流后端（RateLimitBackend enum）
rate-limit-redis = ["firewall-ratelimit", "cache-redis"]
firewall-anomalous = ["firewall"]
firewall-geoip = ["firewall", "limiteron/geo-matching"]
# limiteron rc.6 起 adaptive-limiting/priority-queue 恢复真实实现
firewall-ddos = ["firewall"]
firewall-waf = ["firewall", "web-axum"]
# 后端已迁移至 limiteron GeoMatcher（geo-matching），feature 名保持不变以兼容下游
firewall-maxminddb = ["firewall-geoip", "firewall-anomalous"]
anomalous-detector-dual = ["firewall", "listener", "dao-key-index"]
# 防护增强特性（透传 limiteron 高级能力）
firewall-gcra = ["firewall", "limiteron/gcra"]
firewall-tower = ["firewall", "limiteron/tower-middleware"]
# admission-control 为 limiteron AdmissionController（并发+速率双门准入）；rc.6 起真实实现恢复，名实相符
firewall-admission = ["firewall", "limiteron/admission-control"]
# firewall-event：limiteron event-system（rc.6 起 webhook 调用点已按 cfg 门控，不再牵入 reqwest/hmac/sha2/hex 依赖链）
firewall-event = ["firewall", "limiteron/event-system"]
firewall-monitoring = ["firewall", "limiteron/monitoring"]
firewall-parallel = ["firewall", "limiteron/parallel-checker"]
# dao-key-index：为 GarrisonDaoOxcache 提供 keys() 生产实现（oxcache 无原生 iter）
dao-key-index = []

# 安全告警系统
# security-extra：stp safe-auth 聚合；strategy::alert 实际门控于此
security-extra = []
security-alert = ["security-extra"]
device-binding = ["security-alert"]
# 会话劫持检测：IP 不一致时告警或踢出；依赖 security-alert + auth-server
session-hijack-detection = ["security-alert", "auth-server"]

# Session 增强
# 合并 anonymous-session/session-search/dynamic-active-timeout 等 → session-extra
session-extra = []

# 三层缓存架构
# oxcache/memory：ChainCache 的 L1 内存后端（DashMapMemoryBackend）
three-tier-cache = ["dep:oxcache", "oxcache/memory"]

# 社交登录
social-wechat = ["protocol-oauth2"]
# 启用 rsa（RSA2 签名 + PEM 解析）+ base64（签名值编码）
social-alipay = ["protocol-oauth2", "dep:rsa", "dep:base64", "protocol-zeroize"]

# Keycloak OIDC RP
keycloak-oidc = ["protocol-oidc"]

# OIDC Back-Channel Logout（logout token 签发/持久化投递队列/禁重定向）
# 依赖 oauth2-server：logout token 经 protocol-jwt 签发（透传启用），触发点挂 oauth2_server 模块与 session 登出事件路径
backchannel-logout = ["oauth2-server"]

# 微服务架构
backend-embedded = []
backend-remote = ["dep:reqwest", "limiteron/circuit-breaker", "limiteron/fallback"]
# secure-simple-token：HMAC-SHA256 签名 + 常量时间比较；未启用时 generate 返回 Err
secure-simple-token = ["dep:hmac", "secure-ct-eq"]
auth-server = ["web-axum", "backend-embedded", "auth-server-sdforge", "secure-ct-eq", "secure-simple-token", "dep:mimalloc", "server-graceful-shutdown", "web-security-headers"]
# sha2：决策缓存 key 的 context_json 摘要成分（SHA-256 前 16 字节）
abac = ["dep:cedar-policy", "cache-memory"]
# db-sqlite 下的 RefreshTokenRotation 依赖 protocol::jwt，因此传递启用 protocol-jwt。
oauth2-server = ["protocol-oauth2", "dep:reqwest", "dep:argon2", "dep:rand", "dep:getrandom", "dep:percent-encoding", "protocol-jwt", "secure-ct-eq"]

# inklog 结构化审计日志
# secret-scan：sink 写出前高熵密钥扫描掩码，与 mask_metadata 双层防御
audit-inklog = ["inklog/fast-masking", "inklog/compression", "inklog/secret-scan"]
audit-inklog-http = ["audit-inklog", "inklog/http"]
# SIEM/SOC 外送：TCP(可 TLS) + UDP 转发，断线缓冲重连；TLS 为上游 MVP
audit-inklog-siem = ["audit-inklog", "inklog/net-sink"]

# trait-kit typestate DI 构建
backend-kit = ["backend-embedded", "trait-kit/lifecycle", "trait-kit/health", "trait-kit/observer"]
backend-shutdown = ["backend-kit", "trait-kit/shutdown"]

# sdforge 声明式路由
# [INTERNAL] http 是 garrison↔sdforge 桥接开关：缺则 inventory 注册被剥离，所有 POST 404
http = []
# dep:sdforge：auth-server 的 sdforge 面在此激活（http 为宏镜像 marker）
auth-server-sdforge = ["http", "dep:sdforge"]

# 可观测性
listener = []
credit-metering = ["listener"]
tracing-log = ["tracing/log", "dep:tracing-subscriber"]
metrics-prometheus = ["dep:prometheus", "dep:tracing-subscriber"]
# [INTERNAL] OpenTelemetry 分布式追踪（OTLP gRPC 导出），独立门控以隔离重依赖
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-subscriber"]
grpc = ["dep:tonic", "dep:tonic-health", "dep:tower", "sdforge/grpc"]
# ICU4X 增强层：复数规则 + 日期/数字本地化
i18n-icu = [
    "dep:icu_plurals", "dep:icu_datetime", "dep:icu_decimal",
    "dep:icu_locale_core", "dep:icu_calendar", "dep:icu_time", "dep:fixed_decimal",
]
# 启用后 GarrisonError 实现 miette::Diagnostic trait（保留 thiserror::Error derive）
miette = ["dep:miette"]
garrison-testing = ["authorize-api"]
testing = []

# 聚合特性
full = [
    "cache-memory", "cache-redis",
    "db-sqlite",
    "protocol-oauth2", "protocol-sso", "protocol-jwt", "protocol-sign", "protocol-apikey", "protocol-temp", "protocol-invitation", "protocol-zeroize", "protocol-qrlogin",
    "protocol-oidc", "oauth2-scope-handler", "protocol-sso-server", "protocol-saml",
    "protocol-webauthn", "backchannel-logout",
    "secure-totp", "secure-sign", "protocol-httpbasic", "protocol-httpdigest", "secure-masking",
    "secure-xss", "secure-sanitize", "sms-rate-limit", "email-verification", "email-verification-smtp",
    "field-encryption",
    "mfa-recovery",
    "account-credential", "credential-zeroize", "account-policy", "account-lockout", "account-authflow",
    "account-password-reset",
    "web-axum", "web-actix", "web-warp",
    "web-security",
    "alone-cache", "parameter-query",
    "listener", "metrics-prometheus", "otlp", "grpc", "i18n-icu",
    "audit-inklog", "audit-inklog-siem",
    "annotation-macros",
    "core-advanced", "tenant-isolation",
    "firewall", "firewall-bruteforce", "firewall-ratelimit", "firewall-anomalous",
    "firewall-geoip", "firewall-ddos", "firewall-maxminddb", "firewall-waf",
    "rate-limit-redis",
    "anomalous-detector-dual",
    "security-alert",
    "session-hijack-detection",
    "security-extra",
    "device-binding",
    "session-extra",
    "three-tier-cache",
    "social-wechat", "social-alipay",
    "backend-embedded", "backend-kit", "backend-shutdown", "backend-remote", "auth-server", "auth-server-sdforge", "abac", "oauth2-server",
    "credit-metering",
    "server-health-check", "server-graceful-shutdown",
    "config-full",
    "db-retry", "cache-lock", "cache-invalidation", "ban-sync", "cache-audit",
    "api-docs",
    # 自研库特性吸收
    "config-yaml", "config-audit", "config-consul", "config-etcd", "config-distributed",
    "db-sharding", "db-replica", "db-saga",
    "firewall-gcra", "firewall-tower", "firewall-admission", "firewall-event", "firewall-monitoring", "firewall-parallel",
    "cache-batch", "audit-inklog-http",
]

# production 使用 db-postgres（dbnexus 0.3+ 已支持 postgres feature）
production = [
    "cache-redis", "db-postgres", "web-axum",
    "protocol-jwt", "protocol-sign", "secure-sign",
    "protocol-webauthn", "backchannel-logout", "field-encryption", "mfa-recovery", "account-password-reset",
    "listener", "tracing-log", "metrics-prometheus",
    "audit-inklog",
    "tenant-isolation",
    "security-alert", "session-hijack-detection", "security-extra", "device-binding",
    "core-advanced",
    "firewall-waf",
    "three-tier-cache",
    "sms-rate-limit",
    "backend-embedded", "backend-kit", "auth-server", "auth-server-sdforge", "abac",
    "api-docs",
    # 自研库特性吸收（生产环境）
    "config-yaml", "config-distributed", "config-audit",
    "db-sharding", "db-replica",
    "firewall-gcra", "firewall-tower", "firewall-monitoring", "firewall-parallel",
    # 生产多实例限流：默认仍为 Memory；显式 GARRISON_RATE_LIMIT_BACKEND=redis 切换
    "rate-limit-redis",
    "cache-batch", "cache-audit",
]

development = [
    "cache-memory", "db-sqlite", "web-axum",
]

# 示例文件位于独立 workspace member（examples/），详见 examples/Cargo.toml

[profile.dev]
opt-level = 0
# dev profile 仅保留行号表（-Cdebuginfo=1），避免全量 DWARF 链接峰值内存被 OOM kill
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic 改 unwind：listener 与 SSO channel 依赖 catch_unwind 隔离单任务 panic
panic = "unwind"

# 测试目标

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
required-features = ["full"]

# 数据库后端验收：full 仅含 db-sqlite；Postgres/MySQL 经独立 target + e2e_matrix.sh 执行
[[test]]
name = "acceptance_db_postgres"
path = "tests/acceptance_db_postgres.rs"
required-features = ["db-postgres"]

[[test]]
name = "acceptance_db_mysql"
path = "tests/acceptance_db_mysql.rs"
required-features = ["db-mysql"]

# 分布式限流后端（候选 B）：真 Redis 双实例共享计数 / 滑动窗口 / TTL / reset_prefix 验收。
# 依赖 `GARRISON_TEST_REDIS_URL`（默认 redis://127.0.0.1:6379）；Redis 不可达时用例显式跳过。
[[test]]
name = "redis_limiter_backend"
path = "tests/redis_limiter_backend.rs"
required-features = ["rate-limit-redis"]

# 二进制目标
[[bin]]
name = "auth_server"
path = "src/bin/auth_server.rs"
# cache-memory：bin 使用 GarrisonDaoOxcache，缺失则 auth-server 编译失败
required-features = ["auth-server", "cache-memory"]

# garrison-cli 独立运维 bin：不进默认镜像；required-features 为子命令依赖并集
[[bin]]
name = "garrison-cli"
path = "src/bin/garrison-cli.rs"
required-features = ["cli-ops", "account-credential", "protocol-zeroize", "db-sqlite", "protocol-jwt", "config-yaml", "field-encryption", "dao-key-index"]

# 基准测试目标
[[bench]]
name = "garrison_benchmark"
path = "benches/garrison_benchmark.rs"
harness = false
# bench 用法即 --features full；CI 的 full 口径天然覆盖 bench 目标
required-features = ["full"]

# Lint 配置
# sdforge 宏会 emit mcp/cli/openapi 等外部 cfg，经 check-cfg 登记以保持 warn
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("abac", "account-authflow", "account-credential", "account-lockout", "account-password-reset", "account-policy", "alone-cache", "annotation-macros", "anomalous-detector-dual", "audit-inklog", "audit-inklog-http", "audit-inklog-siem", "audit-log", "authorize-api", "auth-server", "auth-server-sdforge", "backchannel-logout", "backend-embedded", "backend-kit", "backend-remote", "ban-sync", "cache-audit", "cache-batch", "cache-hotkey", "cache-invalidation", "cache-memory", "cache-redis", "cli", "cli-ops", "config-audit", "config-consul", "config-distributed", "config-etcd", "config-schema", "config-security-rules", "config-yaml", "core-advanced", "credential-zeroize", "credit-metering", "dao-key-index", "db-mysql", "db-postgres", "db-replica", "db-saga", "db-sharding", "db-sqlite", "device-binding", "embedded-migrations", "field-encryption", "firewall", "firewall-admission", "firewall-anomalous", "firewall-bruteforce", "firewall-ddos", "firewall-event", "firewall-geoip", "firewall-gcra", "firewall-maxminddb", "firewall-monitoring", "firewall-parallel", "firewall-ratelimit", "firewall-tower", "firewall-waf", "full", "garrison-testing", "grpc", "i18n-icu", "keycloak-oidc", "listener", "manager-explicit", "mcp", "mfa-recovery", "metrics-prometheus", "miette", "oauth2-scope-handler", "oauth2-server", "openapi", "otlp", "parameter-query", "policy-hibp", "protocol-apikey", "protocol-httpbasic", "protocol-httpdigest", "protocol-jwt", "protocol-oauth2", "protocol-oidc", "protocol-qrlogin", "protocol-saml", "protocol-sign", "protocol-sso", "protocol-sso-server", "protocol-temp", "protocol-webauthn", "protocol-zeroize", "rate-limit-redis", "secure-confusable", "secure-ct-eq", "secure-masking", "secure-sanitize", "secure-sign", "secure-simple-token", "secure-totp", "secure-xss", "security-extra", "session-extra", "session-hijack-detection", "sms-rate-limit", "social-alipay", "social-wechat", "tenant-isolation", "testing", "three-tier-cache", "tls", "tracing-log", "web-actix", "web-axum", "web-cors", "web-csrf", "web-security-headers", "web-warp"))',
] }
