[package]
name = "garrison-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
# 必须保留默认特性 link_libfuzzer：fuzz target 均 `#![no_main]`，libfuzzer 的 main 由该特性经 build.rs 编译链接
# 关闭后 `cargo build --bin <target>` 报 undefined symbol: main，fuzz 回归全部无法构建
libfuzzer-sys = "0.4"
# block_on async trait 方法（fuzz_saml_xml）
tokio = { version = "1", default-features = false, features = ["rt"] }
# OidcDiscoveryConfig 反序列化（fuzz_oidc_discovery）
serde_json = { version = "1", default-features = false, features = ["std"] }

[dependencies.garrison]
path = ".."
default-features = false
# fuzz 覆盖的解析入口所需 feature：protocol-saml/protocol-jwt/protocol-httpbasic/protocol-httpdigest
features = ["protocol-saml", "protocol-jwt", "protocol-httpbasic", "protocol-httpdigest"]

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "fuzz_saml_xml"
path = "fuzz_targets/fuzz_saml_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_oidc_discovery"
path = "fuzz_targets/fuzz_oidc_discovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_jwt_verify"
path = "fuzz_targets/fuzz_jwt_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_http_auth_headers"
path = "fuzz_targets/fuzz_http_auth_headers.rs"
test = false
doc = false
bench = false
