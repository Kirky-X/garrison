[package]
name = "garrison-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Procedural macros for Garrison auth framework"
publish = true

[lib]
proc-macro = true

[dependencies]
# 过程宏 crate：proc-macro2/quote 的 proc-macro 特性为宏展开必需；syn 取 default 集（derive/parsing/printing/clone-impls/proc-macro）+ full
syn = { version = "3.0", default-features = false, features = ["full", "derive", "parsing", "printing", "clone-impls", "proc-macro"] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
