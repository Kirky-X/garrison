# cargo-deny 配置 — `cargo deny check` 校验 漏洞/许可证/禁用源/重复依赖；字段见 embarkstudios.github.io/cargo-deny。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# rsa 0.9.x 有 RUSTSEC-2023-0071（Marvin Attack 定时侧信道）且无 patched 版本（rustsec.org/advisories/RUSTSEC-2023-0071），显式忽略：garrison 使用 rsa 仅为私钥签名/公钥验签（alipay 签名、RS256/384/512 验签端经 pkcs1/pkcs8 纯 DER 提取 (n,e)），无解密路径；Marvin Attack 针对解密时序侧信道，本用法不可达。另作 dev-dependency 生成测试密钥对。
# crypto-bigint 0.5.5 有 RUSTSEC-2026-0387（常时运算时序变异，2026-10-23），显式忽略：经 elliptic-curve 0.13 ← p256/p384 0.13 ← jsonwebtoken 11.1.0 引入，修补需 RustCrypto 0.14-gen 栈（crypto-bigint ≥0.7.6 / elliptic-curve 0.14），jsonwebtoken 最新发布 11.1.0 仍锁 0.13-gen，图内无 patched 路径；上游迁移后（jsonwebtoken 支持 p256 0.14 一线）随阶段 7 机械对齐解除本豁免。
# unsafe-libyaml 0.2.11 的 RUSTSEC-2024-0449（unmaintained）豁免已随 YAML 后端由 serde_yaml_ng 换为 serde-saphyr
# （confers 0.6.0-rc.11 / dbnexus 0.6.0-rc.10 / limiteron 0.3.0-rc.8）而移除：unsafe-libyaml 与 serde_yaml_ng
# 已不在依赖图内，cargo-deny 对「未命中任何 crate」的通告项会报 advisory-not-detected 警告。
# 新 YAML 栈（serde-saphyr / granit-parser）的风险接受说明见 SECURITY.md §6。
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0387",
]

[licenses]
# 允许的宽松许可证；新增非宽松许可证需在此放行
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause", "BSD-2-Clause", "ISC",
    "Unicode-3.0",
    "Zlib", "CC0-1.0", "MPL-2.0",
    # limiteron non-optional 后 oxcache/core 透传引入：
    "BSL-1.0",                # xxhash-rust (via redis → oxcache/core)
    "CDLA-Permissive-2.0",    # webpki-root-certs (via reqwest → opentelemetry-otlp → oxcache/core)
    "0BSD",                   # quoted_printable (via lettre → email-verification-smtp)
]
# 置信度阈值 0.5：自研 crate（sdforge-macros/trait-kit）Cargo.toml 缺 license 字段，仅 LICENSE 文件可检测为 MIT（~0.57）
confidence-threshold = 0.5

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 放行 workspace 内 path 依赖的无版本约束（仅 path 协议，registry 依赖仍受 wildcards = "deny" 约束）
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
