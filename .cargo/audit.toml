# cargo-audit 配置 —— `cargo audit`（含门禁脚本独立运行）按此豁免通告。
#
# 豁免集合与 deny.toml [advisories].ignore 保持一致（修改任一处必须同步另一处）。
# 仓库的漏洞门禁以 cargo-deny 为唯一事实来源（ci.yml 已删除独立 audit job，
# 即为避免两份忽略列表漂移）；本文件仅是 `cargo audit` 运行路径的等价桥接，
# 不得在此加入 deny.toml 未记录的豁免项。

[advisories]
ignore = [
    # rsa 0.9.x RUSTSEC-2023-0071（Marvin Attack 定时侧信道，CVSS 5.9 MEDIUM）：
    # 官方无 patched 版本（截至 2026-09-12 最新 0.9.10 仍受影响），无法升级/pin 修复。
    # garrison 的 rsa 路径全部为签名/验签（protocol-saml 验签、social-alipay RSA2 签名、
    # protocol-jwt RS* 签名/验签 + pkcs1/pkcs8 纯 DER 解析），src/ 无 RSA 解密调用，
    # Marvin 针对解密操作，对验签路径不可达。处置论证见 deny.toml [advisories] 注释与
    # SECURITY.md §5；rsa 出修复版后须升级并移除此项，若引入 RSA 解密能力须重新评估。
    # 参见 https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
    # unsafe-libyaml 0.2.11 的 RUSTSEC-2024-0449（unmaintained）豁免已移除：YAML 后端由
    # serde_yaml_ng 换为 serde-saphyr（confers 0.6.0-rc.11 / dbnexus 0.6.0-rc.10 /
    # limiteron 0.3.0-rc.8）后，unsafe-libyaml 与 serde_yaml_ng 已不在依赖图内。
    # 新 YAML 栈（serde-saphyr / granit-parser）的风险接受说明见 SECURITY.md §6。
]
