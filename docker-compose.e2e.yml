name: garrison-e2e

services:
  redis:
    image: redis:7-alpine
    container_name: garrison-e2e-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: garrison-e2e-postgres
    ports:
      - "15432:5432"
    environment:
      # 与 tests/acceptance/environment.rs 的 POSTGRES_URL 默认凭据对齐
      POSTGRES_USER: garrison
      POSTGRES_PASSWORD: garrison
      POSTGRES_DB: garrison_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garrison -d garrison_test"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    container_name: garrison-e2e-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: garrison_root
      MYSQL_USER: garrison
      MYSQL_PASSWORD: garrison
      MYSQL_DATABASE: garrison_test
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugarrison", "-pgarrison"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  # 真实授权服务器（OAuth2/OIDC 协议验收 + OIDC RP 手动联调共用）：
  # realm 数据由 scripts/keycloak_provision.py 供给（幂等，见脚本头注释）
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: garrison-e2e-keycloak
    ports:
      - "18090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    healthcheck:
      # 容器 sh 非 bash：echo -e 不解释转义会发出畸形 HTTP；/ 根路径亦非 200。
      # 用 printf + master realm discovery（确定性 200）探测。
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s

  # === Redis Sentinel 故障演练拓扑（chaos profile，默认不启动）===
  # 单 Sentinel + quorum 1 仅用于演练提速；生产至少 3 Sentinel + quorum 2。
  # 场景脚本：scripts/chaos_redis.sh sentinel
  redis-chaos-master:
    image: redis:7-alpine
    container_name: garrison-chaos-master
    profiles: ["chaos"]
    ports:
      - "16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-chaos-replica:
    image: redis:7-alpine
    container_name: garrison-chaos-replica
    profiles: ["chaos"]
    command: ["redis-server", "--replicaof", "redis-chaos-master", "6379"]
    depends_on:
      redis-chaos-master:
        condition: service_healthy
    ports:
      - "16381:6379"

  redis-chaos-sentinel:
    image: redis:7-alpine
    container_name: garrison-chaos-sentinel
    profiles: ["chaos"]
    # Sentinel 要求配置文件可写（failover 时重写），落到 /tmp
    # Sentinel 在解析 monitor 行时立即做 DNS 解析，compose 网络 DNS 未就绪会
    # FATAL——用循环重试直至解析成功
    entrypoint: sh -c 'printf "sentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel monitor mymaster redis-chaos-master 6379 1\nsentinel down-after-milliseconds mymaster 3000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf; until redis-server /tmp/sentinel.conf --sentinel; do echo "sentinel retry - waiting for DNS"; sleep 2; done'
    depends_on:
      redis-chaos-master:
        condition: service_healthy
    ports:
      - "26379:26379"

volumes:
  redis-data:
  postgres-data:
  mysql-data:
