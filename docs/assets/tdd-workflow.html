<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDD Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #1a2332;
      --color-muted:   #4a5568;
      --color-accent:  #c0392b;
      --color-link:    #2c5282;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 860px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · TDD Workflow</p>
    <h1>Test-Driven Development — Five-Step Loop</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tdd-workflow-title tdd-workflow-desc">
        <title id="tdd-workflow-title">TDD Five-Step Workflow</title>
        <desc id="tdd-workflow-desc">A linear five-step test-driven development workflow: define interface, write tests, implement, run tests pass, then format and lint before commit.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5568"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0392b"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors (drawn first, z-order behind nodes) -->
        <!-- Step 1 → Step 2 -->
        <line x1="240" y1="180" x2="296" y2="180" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step 2 → Step 3 -->
        <line x1="440" y1="180" x2="496" y2="180" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step 3 → Step 4 (accent — the gate) -->
        <line x1="640" y1="180" x2="696" y2="180" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- Step 4 → Step 5 -->
        <line x1="240" y1="340" x2="296" y2="340" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step 5 → Step 6 -->
        <line x1="440" y1="340" x2="496" y2="340" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Feedback loop: Step 6 → Step 2 (dashed, below) -->
        <path d="M 748 376 V 420 H 368 V 216" fill="none" stroke="#4a5568" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Feedback label -->
        <rect x="518" y="412" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="546" y="422" fill="#4a5568" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-TEST</text>

        <!-- Node 1: Define Interface -->
        <rect x="120" y="148" width="120" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="180" y="176" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Define Interface</text>
        <text x="180" y="194" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trait + struct</text>

        <!-- Node 2: Write Tests -->
        <rect x="320" y="148" width="120" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="380" y="176" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write Tests</text>
        <text x="380" y="194" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">happy · error · boundary</text>

        <!-- Node 3: Implement -->
        <rect x="520" y="148" width="120" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="580" y="176" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Implement</text>
        <text x="580" y="194" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">minimum code</text>

        <!-- Node 4: Run Tests Pass (focal) -->
        <rect x="720" y="148" width="120" height="64" rx="6" fill="rgba(192,57,43,0.08)" stroke="#c0392b" stroke-width="1.4"/>
        <text x="780" y="176" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run Tests Pass</text>
        <text x="780" y="194" fill="#c0392b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cargo test</text>

        <!-- Node 5: Format & Lint -->
        <rect x="120" y="308" width="120" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="180" y="336" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Format &amp; Lint</text>
        <text x="180" y="354" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fmt + clippy</text>

        <!-- Node 6: Commit -->
        <rect x="320" y="308" width="120" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="380" y="336" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commit</text>
        <text x="380" y="354" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git commit</text>

        <!-- Step numbers -->
        <circle cx="104" cy="136" r="10" fill="#1a2332"/>
        <text x="104" y="140" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <circle cx="304" cy="136" r="10" fill="#1a2332"/>
        <text x="304" y="140" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
        <circle cx="504" cy="136" r="10" fill="#1a2332"/>
        <text x="504" y="140" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
        <circle cx="704" cy="136" r="10" fill="#c0392b"/>
        <text x="704" y="140" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
        <circle cx="104" cy="296" r="10" fill="#1a2332"/>
        <text x="104" y="300" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
        <circle cx="304" cy="296" r="10" fill="#1a2332"/>
        <text x="304" y="300" fill="#f5f5f5" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
      </svg>
    </div>
  </div>
</body>
</html>
