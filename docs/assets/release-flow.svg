<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rel-flow-title rel-flow-desc" id="release-flow-root">
        <title id="rel-flow-title">Garrison Release Workflow</title>
        <desc id="rel-flow-desc">Release workflow from tag push through parallel CI checks, version consistency, crates.io publish, GitHub release, and final verification.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #release-flow-root { --color-paper: #f5f5f5;
      --color-ink: #1a2332;
      --color-muted: #4a5568;
      --color-accent: #c0392b;
      --color-link: #2c5282;
      --font-sans: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #release-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #release-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #release-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="release-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5568"/></marker>
          <marker id="release-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0392b"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- Stage 1 zone -->
        <rect x="80" y="100" width="640" height="200" rx="8" fill="#1a2332" fill-opacity="0.02" stroke="#1a2332" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="84" y="104" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="144" y="113" fill="#1a2332" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 1: PARALLEL</text>
        <!-- Arrows -->
        <line x1="400" y1="64" x2="400" y2="96" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="160" y1="140" x2="160" y2="176" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="320" y1="140" x2="320" y2="176" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="480" y1="140" x2="480" y2="176" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="640" y1="140" x2="640" y2="176" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="160" y1="260" x2="160" y2="316" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="320" y1="260" x2="320" y2="316" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="480" y1="260" x2="480" y2="316" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="640" y1="260" x2="640" y2="316" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="160" y1="320" x2="396" y2="320" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="320" y1="320" x2="396" y2="320" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="480" y1="320" x2="404" y2="320" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="640" y1="320" x2="404" y2="320" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="400" y1="360" x2="400" y2="396" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="400" y1="440" x2="400" y2="476" stroke="#4a5568" stroke-width="1.2" marker-end="url(#release-flow-arrow)"/>
        <line x1="400" y1="520" x2="400" y2="556" stroke="#c0392b" stroke-width="1.2" marker-end="url(#release-flow-arrow-accent)"/>
        <!-- Start: Tag push -->
        <rect x="320" y="24" width="160" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="320" y="24" width="160" height="40" rx="20" fill="#1a2332" fill-opacity="0.03" stroke="#1a2332" stroke-opacity="0.30" stroke-width="1"/>
        <text x="400" y="49" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">Tag Push</text>
        <!-- Stage 1: lint-check -->
        <rect x="100" y="180" width="120" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="180" width="120" height="80" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="160" y="214" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">lint-check</text>
        <text x="160" y="232" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fmt + clippy</text>
        <!-- Stage 1: test-check -->
        <rect x="260" y="180" width="120" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="180" width="120" height="80" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="320" y="214" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">test-check</text>
        <text x="320" y="232" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lib + E2E</text>
        <!-- Stage 1: security-check -->
        <rect x="420" y="180" width="120" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="180" width="120" height="80" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="480" y="214" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">security-check</text>
        <text x="480" y="232" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cargo deny</text>
        <!-- Stage 1: doc-check -->
        <rect x="580" y="180" width="120" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="580" y="180" width="120" height="80" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="640" y="214" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">doc-check</text>
        <text x="640" y="232" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cargo doc</text>
        <!-- Stage 2: version-consistency -->
        <rect x="280" y="320" width="240" height="40" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="320" width="240" height="40" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="400" y="345" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">version-consistency</text>
        <!-- Stage 3: publish-crates-io -->
        <rect x="280" y="400" width="240" height="40" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="400" width="240" height="40" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="400" y="425" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">publish-crates-io</text>
        <!-- Stage 4: github-release -->
        <rect x="280" y="480" width="240" height="40" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="480" width="240" height="40" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <text x="400" y="505" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">github-release</text>
        <!-- Stage 5: verify-release (end) -->
        <rect x="300" y="560" width="200" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="300" y="560" width="200" height="40" rx="20" fill="#c0392b" fill-opacity="0.08" stroke="#c0392b" stroke-width="1.2"/>
        <text x="400" y="585" fill="#c0392b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">verify-release</text>
      </svg>
