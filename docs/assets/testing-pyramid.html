<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testing Pyramid</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #1a2332;
      --color-muted: #4a5568;
      --color-accent: #c0392b;
      --color-link: #2c5282;
      --font-sans: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 900px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pyramid · Diagram Design</p>
    <h1>测试金字塔</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-pyr-title test-pyr-desc">
        <title id="test-pyr-title">Garrison Testing Pyramid</title>
        <desc id="test-pyr-desc">Testing pyramid showing five layers from unit tests (5361) at the base through acceptance tests, example-level tests, UI/compile-fail tests, to benchmarks (6 scenarios) at the apex, with three quality defense lines.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5568"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- Direction indicator -->
        <text x="24" y="60" fill="#4a5568" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" transform="rotate(-90 24 60)">RARER</text>
        <line x1="28" y1="100" x2="28" y2="460" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- Pyramid layers (point up, base = unit tests) -->
        <!-- Layer 5: Benchmarks (apex) -->
        <polygon points="360,60 440,60 428,120 372,120" fill="rgba(192,57,43,0.08)" stroke="#c0392b" stroke-width="1.2"/>
        <text x="400" y="88" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">Benchmarks</text>
        <text x="400" y="104" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6 scenarios</text>
        <!-- Layer 4: UI/compile-fail -->
        <polygon points="320,120 480,120 460,180 340,180" fill="#f5f5f5" stroke="rgba(26,35,50,0.12)" stroke-width="1"/>
        <text x="400" y="148" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">UI / Compile-Fail</text>
        <text x="400" y="164" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8 tests</text>
        <!-- Layer 3: Example-level -->
        <polygon points="260,180 540,180 512,240 288,240" fill="#f5f5f5" stroke="rgba(26,35,50,0.12)" stroke-width="1"/>
        <text x="400" y="208" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">Example-Level Integration</text>
        <text x="400" y="224" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~116 tests</text>
        <!-- Layer 2: Acceptance/Integration -->
        <polygon points="180,240 620,240 580,300 220,300" fill="#f5f5f5" stroke="rgba(26,35,50,0.12)" stroke-width="1"/>
        <text x="400" y="268" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">Acceptance / Integration</text>
        <text x="400" y="284" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">416 tests</text>
        <!-- Layer 1: Unit tests (base) -->
        <polygon points="100,300 700,300 652,360 148,360" fill="#f5f5f5" stroke="rgba(26,35,50,0.12)" stroke-width="1"/>
        <text x="400" y="328" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">Unit Tests</text>
        <text x="400" y="344" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5361 tests</text>
        <!-- Quality defense lines annotation -->
        <rect x="560" y="380" width="220" height="120" rx="6" fill="#f5f5f5" stroke="rgba(26,35,50,0.12)" stroke-width="1"/>
        <text x="576" y="404" fill="#4a5568" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">QUALITY DEFENSE LINES</text>
        <line x1="576" y1="412" x2="764" y2="412" stroke="rgba(26,35,50,0.10)" stroke-width="0.8"/>
        <text x="576" y="432" fill="#1a2332" font-size="10" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif">ci.yml</text>
        <text x="576" y="446" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace">push / PR · coverage >=85%</text>
        <text x="576" y="468" fill="#1a2332" font-size="10" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif">feature-matrix.yml</text>
        <text x="576" y="482" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace">weekly · each-feature</text>
        <text x="576" y="504" fill="#1a2332" font-size="10" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif">e2e_matrix.sh</text>
        <text x="576" y="518" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace">manual · pre-release</text>
      </svg>
    </div>
  </div>
</body>
</html>
