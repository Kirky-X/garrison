        <rect x="468" y="186" width="36" height="12" rx="2" fill="none" stroke="#c0392b" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="486" y="195" fill="#c0392b" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOGIC</text>
        <text x="560" y="214" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">GarrisonLogicDefault</text>
        <text x="560" y="232" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 subtraits aggregated</text>
        <text x="560" y="248" fill="#4a5568" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Session · Permission · Token · Mfa · Password</text>
        <!-- GarrisonInterface -->
        <rect x="460" y="60" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="460" y="60" width="200" height="56" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <rect x="468" y="66" width="32" height="12" rx="2" fill="none" stroke="#1a2332" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="484" y="75" fill="#1a2332" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRAIT</text>
        <text x="560" y="94" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">GarrisonInterface</text>
        <text x="560" y="108" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">business data source</text>
        <!-- GarrisonDao -->
        <rect x="720" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="200" width="160" height="64" rx="6" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
        <rect x="728" y="206" width="28" height="12" rx="2" fill="none" stroke="#1a2332" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="742" y="215" fill="#1a2332" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DAO</text>
        <text x="800" y="228" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">GarrisonDao</text>
        <text x="800" y="246" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">persistence trait</text>
        <!-- oxcache (store) -->
        <rect x="720" y="80" width="140" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="80" width="140" height="56" rx="6" fill="#1a2332" fill-opacity="0.05" stroke="#4a5568" stroke-width="1"/>
        <rect x="728" y="86" width="44" height="12" rx="2" fill="none" stroke="#4a5568" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="750" y="95" fill="#4a5568" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
        <text x="790" y="114" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">oxcache</text>
        <text x="790" y="128" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L1 memory + L2 redis</text>
        <!-- dbnexus (store) -->
        <rect x="720" y="320" width="140" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="320" width="140" height="56" rx="6" fill="#1a2332" fill-opacity="0.05" stroke="#4a5568" stroke-width="1"/>
        <rect x="728" y="326" width="28" height="12" rx="2" fill="none" stroke="#4a5568" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="742" y="335" fill="#4a5568" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="790" y="354" fill="#1a2332" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif" text-anchor="middle">dbnexus</text>
        <text x="790" y="368" fill="#4a5568" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite / PG / MySQL</text>
