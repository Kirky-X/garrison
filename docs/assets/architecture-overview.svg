<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-overview-title arch-overview-desc" id="architecture-overview-root">
        <title id="arch-overview-title">Garrison Architecture Overview</title>
        <desc id="arch-overview-desc">Dual-abstraction-layer architecture showing delegation from GarrisonUtil through GarrisonManager and GarrisonLogicDefault to GarrisonDao and backend storage systems.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-overview-root { --color-paper: #f5f5f5;
      --color-ink: #1a2332;
      --color-muted: #4a5568;
      --color-accent: #c0392b;
      --color-link: #2c5282;
      --font-sans: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft Jhei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #architecture-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-overview-root .diagram-container { overflow-x: visible; }</style>
          <marker id="architecture-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5568"/></marker>
          <marker id="architecture-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0392b"/></marker>
          <marker id="architecture-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2c5282"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- Arrows -->
        <line x1="180" y1="232" x2="236" y2="232" stroke="#4a5568" stroke-width="1.2" marker-end="url(#architecture-overview-arrow)"/>
        <line x1="400" y1="232" x2="456" y2="232" stroke="#4a5568" stroke-width="1.2" marker-end="url(#architecture-overview-arrow)"/>
        <line x1="560" y1="180" x2="560" y2="120" stroke="#4a5568" stroke-width="1.2" marker-end="url(#architecture-overview-arrow)"/>
        <line x1="660" y1="232" x2="716" y2="232" stroke="#c0392b" stroke-width="1.2" marker-end="url(#architecture-overview-arrow-accent)"/>
        <line x1="760" y1="200" x2="760" y2="140" stroke="#4a5568" stroke-width="1.2" marker-end="url(#architecture-overview-arrow)"/>
        <line x1="840" y1="264" x2="840" y2="316" stroke="#4a5568" stroke-width="1.2" marker-end="url(#architecture-overview-arrow)"/>
        <!-- Arrow labels -->
        <rect x="192" y="212" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="210" y="221" fill="#4a5568" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALL</text>
        <rect x="412" y="212" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="430" y="221" fill="#4a5568" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOLD</text>
